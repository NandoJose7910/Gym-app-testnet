<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymPro — Sistema Integral de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
  onerror="(function(){console.warn('[GymApp] jsdelivr falló, probando cdnjs…');var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';s.onerror=function(){console.warn('[GymApp] cdnjs falló, probando unpkg…');var s2=document.createElement('script');s2.src='https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js';document.head.appendChild(s2);};document.head.appendChild(s);})()"></script>
<style>
/* ======================================================
   VARIABLES GLOBALES
====================================================== */
:root {
  --bg:          #0a0a0a;
  --bg-card:     #141414;
  --bg-card2:    #1e1e1e;
  --bg-card3:    #252525;
  --green:       #00FF66;
  --green-dk:    #00cc44;
  --green-dim:   rgba(0,255,102,.10);
  --green-dim2:  rgba(0,255,102,.05);
  --white:       #ffffff;
  --gray:        #888888;
  --gray-lt:     #444444;
  --gray-dk:     #2a2a2a;
  --red:         #ff4444;
  --red-dim:     rgba(255,68,68,.10);
  --orange:      #ff8800;
  --orange-dim:  rgba(255,136,0,.10);
  --blue:        #4488ff;
  --blue-dim:    rgba(68,136,255,.10);
  --sidebar-w:   260px;
  --sidebar-col: 68px;
  --radius:      10px;
  --radius-lg:   14px;
}

/* ======================================================
   RESET & BASE
====================================================== */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:'Barlow',sans-serif;
  background:var(--bg);
  color:var(--white);
  font-size:15px;
  line-height:1.5;
}
a { color:inherit; text-decoration:none; }
button { font-family:'Barlow',sans-serif; }
input,select,textarea { font-family:'Barlow',sans-serif; }

/* Scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--gray-lt); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--green); }

/* ======================================================
   PANTALLA DE LOGIN
====================================================== */
#login-screen {
  position:fixed; inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:16px;
}

.login-bg-accent {
  position:absolute;
  width:600px; height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,255,102,.06) 0%, transparent 70%);
  top:-100px; left:-100px;
  pointer-events:none;
}

.login-box {
  background:var(--bg-card);
  border:1px solid #222;
  border-radius:var(--radius-lg);
  padding:48px 40px;
  width:100%;
  max-width:420px;
  text-align:center;
  position:relative;
  z-index:1;
  box-shadow:0 32px 80px rgba(0,0,0,.6);
}

.login-logo {
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;
  letter-spacing:5px;
  line-height:1;
  margin-bottom:4px;
}
.login-logo span { color:var(--green); }

.login-tagline {
  font-size:11px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gray);
  margin-bottom:36px;
}

.role-tabs {
  display:flex;
  background:var(--bg-card2);
  border-radius:8px;
  padding:4px;
  margin-bottom:28px;
  gap:4px;
}
.role-tab {
  flex:1;
  padding:10px 8px;
  border:none;
  border-radius:6px;
  background:transparent;
  color:var(--gray);
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
}
.role-tab.active {
  background:var(--green);
  color:#000;
}

.login-form { text-align:left; }

.lg-field { margin-bottom:20px; }
.lg-field label {
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gray);
  margin-bottom:8px;
}
.lg-field input {
  width:100%;
  padding:13px 16px;
  background:var(--bg-card2);
  border:1px solid #333;
  border-radius:8px;
  color:var(--white);
  font-size:15px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.lg-field input:focus {
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-dim);
}
.lg-field input[type="password"] { letter-spacing:4px; font-size:18px; }

#login-error {
  display:none;
  background:var(--red-dim);
  border:1px solid rgba(255,68,68,.3);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  color:var(--red);
  margin-bottom:16px;
  text-align:center;
}

.btn-login {
  width:100%;
  padding:15px;
  background:var(--green);
  color:#000;
  border:none;
  border-radius:10px;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:3px;
  cursor:pointer;
  transition:all .2s;
  margin-top:4px;
}
.btn-login:hover { background:var(--green-dk); transform:translateY(-1px); box-shadow:0 8px 24px rgba(0,255,102,.25); }
.btn-login:active { transform:translateY(0); }

.login-hint {
  margin-top:20px;
  font-size:12px;
  color:var(--gray);
  text-align:center;
  line-height:1.8;
}

/* ======================================================
   APP LAYOUT
====================================================== */
#app {
  display:none;
  height:100vh;
  overflow:hidden;
}
#app.show { display:flex; }

/* ======================================================
   SIDEBAR
====================================================== */
#sidebar {
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:var(--bg-card);
  border-right:1px solid #1e1e1e;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  transition:width .28s ease, min-width .28s ease;
  position:relative;
  z-index:100;
  flex-shrink:0;
}
#sidebar.collapsed {
  width:var(--sidebar-col);
  min-width:var(--sidebar-col);
}

.sidebar-head {
  padding:20px 16px;
  border-bottom:1px solid #1e1e1e;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:70px;
  flex-shrink:0;
}
.sidebar-logo {
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  letter-spacing:3px;
  white-space:nowrap;
  overflow:hidden;
  transition:opacity .2s;
}
.sidebar-logo span { color:var(--green); }
#sidebar.collapsed .sidebar-logo { opacity:0; width:0; }

.sidebar-toggle-btn {
  margin-left:auto;
  background:transparent;
  border:none;
  color:var(--gray);
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:color .2s, background .2s;
}
.sidebar-toggle-btn:hover { color:var(--white); background:var(--bg-card2); }

.sidebar-nav {
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px 8px;
}

.nav-group-label {
  padding:10px 10px 4px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gray-lt);
  white-space:nowrap;
  overflow:hidden;
  transition:opacity .2s;
}
#sidebar.collapsed .nav-group-label { opacity:0; }

.nav-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 12px;
  border-radius:8px;
  margin:2px 0;
  cursor:pointer;
  color:var(--gray);
  white-space:nowrap;
  overflow:hidden;
  position:relative;
  transition:background .15s, color .15s;
  user-select:none;
}
.nav-item:hover { background:var(--bg-card2); color:var(--white); }
.nav-item.active {
  background:var(--green-dim);
  color:var(--green);
}
.nav-item.active::before {
  content:'';
  position:absolute;
  left:0; top:50%;
  transform:translateY(-50%);
  width:3px; height:22px;
  background:var(--green);
  border-radius:0 2px 2px 0;
}
.nav-icon { font-size:18px; flex-shrink:0; width:22px; text-align:center; }
.nav-label { font-size:14px; font-weight:500; overflow:hidden; }
#sidebar.collapsed .nav-label { display:none; }

/* Tooltip on collapsed sidebar */
#sidebar.collapsed .nav-item { justify-content:center; }
#sidebar.collapsed .nav-item[title]:hover::after {
  content:attr(title);
  position:absolute;
  left:calc(var(--sidebar-col) + 8px);
  background:var(--bg-card2);
  border:1px solid #333;
  border-radius:6px;
  padding:6px 12px;
  font-size:13px;
  color:var(--white);
  white-space:nowrap;
  pointer-events:none;
  z-index:200;
}

.sidebar-foot {
  border-top:1px solid #1e1e1e;
  padding:14px 12px;
  flex-shrink:0;
  overflow:hidden;
}
.user-chip {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
  overflow:hidden;
}
.user-avatar {
  width:36px; height:36px;
  border-radius:50%;
  background:var(--green-dim);
  border:2px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-weight:700;
  font-size:14px;
  flex-shrink:0;
}
.user-dets { overflow:hidden; }
.user-name-s { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-role-s { font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
#sidebar.collapsed .user-dets { display:none; }

.btn-logout {
  width:100%;
  padding:8px;
  background:transparent;
  border:1px solid #2a2a2a;
  border-radius:7px;
  color:var(--gray);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:.5px;
  transition:all .2s;
  white-space:nowrap;
  overflow:hidden;
}
.btn-logout:hover { border-color:var(--red); color:var(--red); }
#sidebar.collapsed .btn-logout { font-size:16px; padding:6px; }

/* ======================================================
   MAIN CONTENT AREA
====================================================== */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  min-width:0;
}

#topbar {
  background:var(--bg-card);
  border-bottom:1px solid #1e1e1e;
  padding:0 28px;
  height:64px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-shrink:0;
}
.topbar-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  letter-spacing:2px;
}
.topbar-breadcrumb {
  margin-left:auto;
  font-size:12px;
  color:var(--gray);
}
.topbar-back {
  background:transparent;
  border:1px solid #333;
  border-radius:7px;
  color:var(--gray);
  padding:6px 14px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
}
.topbar-back:hover { color:var(--white); border-color:var(--gray); }

#view {
  flex:1;
  overflow-y:auto;
  padding:28px;
}

/* ======================================================
   BOTTOM NAV (mobile)
====================================================== */
#bottom-nav {
  display:none;
  position:fixed;
  bottom:0; left:0; right:0;
  background:var(--bg-card);
  border-top:1px solid #1e1e1e;
  padding:6px 0 10px;
  z-index:200;
}
.bnav-items { display:flex; justify-content:space-around; }
.bnav-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:4px 10px;
  cursor:pointer;
  color:var(--gray);
  font-size:10px;
  font-weight:600;
  letter-spacing:.5px;
  text-transform:uppercase;
  transition:color .15s;
}
.bnav-item.active { color:var(--green); }
.bnav-item span:first-child { font-size:20px; }

/* ======================================================
   CARDS
====================================================== */
.card {
  background:var(--bg-card);
  border:1px solid #222;
  border-radius:var(--radius-lg);
  padding:24px;
}
.card + .card { margin-top:0; }

.card-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:19px;
  letter-spacing:2px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ======================================================
   STAT CARDS
====================================================== */
.stat-card {
  background:var(--bg-card);
  border:1px solid #222;
  border-radius:var(--radius-lg);
  padding:20px 22px;
  position:relative;
  overflow:hidden;
}
.stat-card::after {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:var(--green);
  border-radius:0 0 2px 2px;
}
.stat-card.red::after { background:var(--red); }
.stat-card.orange::after { background:var(--orange); }
.stat-card.blue::after { background:var(--blue); }

.stat-lbl { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gray); margin-bottom:6px; }
.stat-val { font-family:'Bebas Neue',sans-serif; font-size:40px; letter-spacing:2px; line-height:1; color:var(--green); }
.stat-card.red .stat-val { color:var(--red); }
.stat-card.orange .stat-val { color:var(--orange); }
.stat-card.blue .stat-val { color:var(--blue); }
.stat-sub { font-size:12px; color:var(--gray); margin-top:4px; }

/* ======================================================
   GRIDS
====================================================== */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
.g4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:20px; }
.gap-16 { gap:16px !important; }
.gap-12 { gap:12px !important; }

/* ======================================================
   SECTION HEADER
====================================================== */
.sec-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.sec-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;
  letter-spacing:2px;
}

/* ======================================================
   TABLAS
====================================================== */
.tbl-wrap {
  border-radius:var(--radius);
  border:1px solid #222;
  overflow:hidden;
  overflow-x:auto;
}
table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
thead th {
  background:var(--bg-card2);
  padding:11px 16px;
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gray);
  border-bottom:1px solid #2a2a2a;
  white-space:nowrap;
}
tbody tr { border-bottom:1px solid #1a1a1a; transition:background .12s; }
tbody tr:nth-child(even) { background:rgba(255,255,255,.015); }
tbody tr:hover { background:rgba(0,255,102,.025); }
tbody tr:last-child { border-bottom:none; }
tbody td {
  padding:11px 16px;
  vertical-align:middle;
}
.tbl-actions { display:flex; gap:6px; }

/* ======================================================
   BADGES
====================================================== */
.badge {
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
  white-space:nowrap;
}
.badge-green { background:rgba(0,255,102,.12); color:var(--green); border:1px solid rgba(0,255,102,.25); }
.badge-red   { background:rgba(255,68,68,.12); color:var(--red); border:1px solid rgba(255,68,68,.25); }
.badge-orange{ background:rgba(255,136,0,.12); color:var(--orange); border:1px solid rgba(255,136,0,.25); }
.badge-gray  { background:rgba(136,136,136,.1); color:var(--gray); border:1px solid rgba(136,136,136,.2); }
.badge-blue  { background:rgba(68,136,255,.12); color:var(--blue); border:1px solid rgba(68,136,255,.25); }

@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:.3; }
}
.badge-blink { animation:blink 1.3s ease-in-out infinite; }

/* ======================================================
   BOTONES
====================================================== */
.btn {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 20px;
  border-radius:8px;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
}
.btn-sm { padding:6px 14px; font-size:12px; }
.btn-lg { padding:14px 28px; font-size:16px; }
.btn-icon {
  background:transparent;
  border:none;
  color:var(--gray);
  cursor:pointer;
  padding:6px 8px;
  border-radius:6px;
  font-size:15px;
  transition:all .18s;
}
.btn-icon:hover { background:var(--bg-card2); }
.btn-icon.g:hover { color:var(--green); }
.btn-icon.r:hover { color:var(--red); }
.btn-icon.b:hover { color:var(--blue); }

.btn-green { background:var(--green); color:#000; font-weight:700; }
.btn-green:hover { background:var(--green-dk); transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,255,102,.2); }

.btn-outline { background:transparent; border:1px solid #3a3a3a; color:var(--white); }
.btn-outline:hover { border-color:var(--white); background:rgba(255,255,255,.04); }

.btn-outline-green { background:transparent; border:1px solid var(--green); color:var(--green); }
.btn-outline-green:hover { background:var(--green-dim); }

.btn-danger { background:transparent; border:1px solid var(--red); color:var(--red); }
.btn-danger:hover { background:var(--red-dim); }

.btn-ghost { background:transparent; border:none; color:var(--gray); }
.btn-ghost:hover { color:var(--white); background:var(--bg-card2); }

/* ======================================================
   FORMULARIOS
====================================================== */
.frow { display:grid; gap:16px; margin-bottom:16px; }
.frow-2 { grid-template-columns:1fr 1fr; }
.frow-3 { grid-template-columns:1fr 1fr 1fr; }
.frow-4 { grid-template-columns:1fr 1fr 1fr 1fr; }

.field { display:flex; flex-direction:column; gap:6px; }
.field label {
  font-size:11px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--gray);
}
.field input,
.field select,
.field textarea {
  background:var(--bg-card2);
  border:1px solid #333;
  border-radius:8px;
  color:var(--white);
  font-size:14px;
  padding:10px 14px;
  outline:none;
  transition:border-color .18s, box-shadow .18s;
  width:100%;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-dim);
}
.field textarea { resize:vertical; min-height:80px; }
.field select option { background:var(--bg-card2); }
.field input[type="number"] { -moz-appearance:textfield; }
.field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
.field-note { font-size:11px; color:var(--gray); margin-top:2px; }
.field-calc {
  background:var(--bg-card3);
  border:1px solid #333;
  border-radius:8px;
  color:var(--green);
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  padding:10px 14px;
  letter-spacing:1px;
}

/* Checkboxes y radios */
.check-group, .radio-group { display:flex; flex-wrap:wrap; gap:10px; }
.check-item, .radio-item {
  display:flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
  padding:7px 12px;
  border:1px solid #333;
  border-radius:7px;
  transition:all .15s;
}
.check-item:hover, .radio-item:hover { border-color:var(--green); background:var(--green-dim); }
.check-item input[type="checkbox"],
.radio-item input[type="radio"] {
  width:15px; height:15px;
  accent-color:var(--green);
  cursor:pointer;
  background:transparent;
  border:none;
  padding:0;
  box-shadow:none;
}
.check-item label, .radio-item label {
  font-size:13px;
  color:var(--white);
  cursor:pointer;
  font-weight:500;
  text-transform:none;
  letter-spacing:0;
}
/* Eliminar bordes heredados en inputs dentro de check/radio */
.check-item input, .radio-item input { background:none !important; border:none !important; box-shadow:none !important; padding:0 !important; width:15px !important; height:15px !important; }

.fsec { margin-bottom:28px; padding-bottom:28px; border-bottom:1px solid #1e1e1e; }
.fsec:last-child { border-bottom:none; margin-bottom:0; }
.fsec-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:17px;
  letter-spacing:2px;
  color:var(--green);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ======================================================
   MODALES
====================================================== */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
  backdrop-filter:blur(4px);
}
.modal {
  background:var(--bg-card);
  border:1px solid #2a2a2a;
  border-radius:var(--radius-lg);
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow-y:auto;
  box-shadow:0 32px 80px rgba(0,0,0,.7);
}
.modal-md { max-width:720px; }
.modal-lg { max-width:960px; }
.modal-xl { max-width:1200px; }

.modal-head {
  padding:22px 26px;
  border-bottom:1px solid #1e1e1e;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  background:var(--bg-card);
  z-index:10;
}
.modal-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:2px;
}
.modal-close {
  background:transparent;
  border:none;
  color:var(--gray);
  cursor:pointer;
  font-size:26px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px; height:32px;
  border-radius:6px;
  transition:all .18s;
}
.modal-close:hover { color:var(--white); background:var(--bg-card2); }
.modal-body { padding:24px 26px; }
.modal-foot {
  padding:16px 26px 22px;
  border-top:1px solid #1e1e1e;
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

/* ======================================================
   TABS
====================================================== */
.tabs {
  display:flex;
  border-bottom:1px solid #222;
  margin-bottom:24px;
  overflow-x:auto;
  gap:0;
}
.tab-btn {
  padding:11px 18px;
  background:transparent;
  border:none;
  border-bottom:2px solid transparent;
  color:var(--gray);
  font-size:13px;
  font-weight:600;
  letter-spacing:.8px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  margin-bottom:-1px;
}
.tab-btn:hover { color:var(--white); }
.tab-btn.active { color:var(--green); border-bottom-color:var(--green); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

/* ======================================================
   ALERTAS
====================================================== */
.alert {
  padding:12px 16px;
  border-radius:8px;
  font-size:13px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:16px;
  line-height:1.5;
}
.alert-icon { flex-shrink:0; font-size:16px; }
.alert-warn { background:var(--orange-dim); border:1px solid rgba(255,136,0,.3); color:var(--orange); }
.alert-danger { background:var(--red-dim); border:1px solid rgba(255,68,68,.3); color:var(--red); }
.alert-success { background:var(--green-dim); border:1px solid rgba(0,255,102,.25); color:var(--green); }
.alert-info { background:var(--blue-dim); border:1px solid rgba(68,136,255,.25); color:var(--blue); }

/* ======================================================
   SEARCH BAR
====================================================== */
.search-wrap {
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-card2);
  border:1px solid #2a2a2a;
  border-radius:var(--radius);
  padding:10px 16px;
  margin-bottom:20px;
}
.search-wrap input {
  flex:1;
  background:transparent;
  border:none;
  color:var(--white);
  font-size:14px;
  outline:none;
}
.search-wrap select {
  background:transparent;
  border:none;
  color:var(--gray);
  font-size:13px;
  outline:none;
  cursor:pointer;
}
.search-wrap select option { background:var(--bg-card2); }
.search-icon { color:var(--gray); font-size:18px; flex-shrink:0; }

/* ======================================================
   MEMBER CARD (lista)
====================================================== */
.member-card {
  background:var(--bg-card);
  border:1px solid #222;
  border-radius:var(--radius-lg);
  padding:18px 20px;
  display:flex;
  gap:16px;
  align-items:center;
  cursor:pointer;
  transition:all .18s;
}
.member-card:hover { border-color:var(--green); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.4); }

.m-avatar {
  width:48px; height:48px;
  border-radius:50%;
  background:var(--green-dim);
  border:2px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-weight:700;
  font-size:18px;
  flex-shrink:0;
}
.m-info { flex:1; min-width:0; }
.m-name { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.m-meta { font-size:12px; color:var(--gray); margin-top:2px; }
.m-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.m-side { text-align:right; flex-shrink:0; }

/* ======================================================
   PROFILE HEADER CARD
====================================================== */
.profile-hero {
  background:var(--bg-card);
  border:1px solid #222;
  border-radius:var(--radius-lg);
  padding:28px;
  display:flex;
  gap:24px;
  align-items:center;
  margin-bottom:24px;
}
.profile-avatar-lg {
  width:72px; height:72px;
  border-radius:50%;
  background:var(--green-dim);
  border:3px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:1px;
  flex-shrink:0;
}
.profile-info { flex:1; min-width:0; }
.profile-name {
  font-family:'Bebas Neue',sans-serif;
  font-size:30px;
  letter-spacing:2px;
  line-height:1.1;
}
.profile-sub { font-size:13px; color:var(--gray); margin-top:4px; }
.profile-badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.profile-actions { display:flex; flex-direction:column; gap:8px; }

/* ======================================================
   PROGRESS BARS
====================================================== */
.pbar { height:6px; background:#2a2a2a; border-radius:3px; overflow:hidden; }
.pbar-fill { height:100%; border-radius:3px; transition:width .5s ease; }
.pbar-green { background:var(--green); }
.pbar-red { background:var(--red); }
.pbar-orange { background:var(--orange); }

/* ======================================================
   CHARTS
====================================================== */
.chart-wrap { position:relative; height:250px; width:100%; overflow:hidden; }
.chart-wrap.tall { height:300px; }

/* ======================================================
   DELTA CARDS (avances)
====================================================== */
.delta-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
.delta-card {
  background:var(--bg-card2);
  border-radius:var(--radius);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.delta-ico { font-size:22px; margin-bottom:4px; }
.delta-lbl { font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
.delta-val { font-family:'Bebas Neue',sans-serif; font-size:22px; }
.dv-pos { color:var(--green); }
.dv-neg { color:var(--red); }
.dv-neu { color:var(--white); }

/* ======================================================
   NUTRITION TOTALS
====================================================== */
.nutri-totals {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  background:var(--bg-card2);
  border-radius:var(--radius);
  padding:16px;
  margin-top:16px;
}
.nt-item { text-align:center; }
.nt-val { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--green); }
.nt-lbl { font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }

/* ======================================================
   CALC BOX (TMB/TDEE)
====================================================== */
.calc-box {
  background:var(--green-dim2);
  border:1px solid rgba(0,255,102,.15);
  border-radius:var(--radius);
  padding:16px 20px;
  margin:16px 0;
}
.calc-box-title {
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--green);
  margin-bottom:12px;
}
.calc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.calc-item .c-lbl { font-size:10px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
.calc-item .c-val { font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--white); }

/* ======================================================
   TRAINING DAY
====================================================== */
.day-block {
  background:var(--bg-card2);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  border:1px solid #222;
}
.day-block-head {
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  transition:background .15s;
}
.day-block-head:hover { background:var(--bg-card3); }
.day-block-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  letter-spacing:2px;
  color:var(--green);
}
.day-block-body { padding:0 18px 16px; }

/* Inline exercise table (editable) */
.ex-tbl-wrap { overflow-x:auto; border-radius:8px; border:1px solid #2a2a2a; }
.ex-tbl thead th { background:var(--bg-card3); }
.ex-tbl input, .ex-tbl select {
  background:var(--bg-card3);
  border:1px solid #333;
  border-radius:5px;
  color:var(--white);
  font-size:13px;
  padding:5px 8px;
  width:100%;
  min-width:60px;
  outline:none;
}
.ex-tbl input:focus, .ex-tbl select:focus { border-color:var(--green); }

/* ======================================================
   EMPTY STATE
====================================================== */
.empty-state {
  text-align:center;
  padding:60px 20px;
  color:var(--gray);
}
.empty-ico { font-size:48px; margin-bottom:16px; }
.empty-txt { font-size:15px; margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--gray-lt); }

/* ======================================================
   SEPARADORES Y UTILS
====================================================== */
.sep { border:none; border-top:1px solid #1e1e1e; margin:20px 0; }
.mt-8 { margin-top:8px; }
.mt-12 { margin-top:12px; }
.mt-16 { margin-top:16px; }
.mt-20 { margin-top:20px; }
.mt-24 { margin-top:24px; }
.mt-32 { margin-top:32px; }
.mb-8 { margin-bottom:8px; }
.mb-12 { margin-bottom:12px; }
.mb-16 { margin-bottom:16px; }
.mb-20 { margin-bottom:20px; }
.mb-24 { margin-bottom:24px; }
.flex { display:flex; }
.flex-c { display:flex; align-items:center; }
.flex-b { display:flex; align-items:center; justify-content:space-between; }
.gap-8 { gap:8px; }
.gap-12 { gap:12px; }
.gap-16 { gap:16px; }
.tc { text-align:center; }
.tr { text-align:right; }
.text-green { color:var(--green); }
.text-red { color:var(--red); }
.text-orange { color:var(--orange); }
.text-gray { color:var(--gray); }
.text-sm { font-size:12px; }
.text-xs { font-size:11px; }
.text-lg { font-size:18px; }
.fw-600 { font-weight:600; }
.fw-700 { font-weight:700; }
.font-title { font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
.hidden { display:none !important; }
.w-full { width:100%; }
.truncate { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ======================================================
   TOAST
====================================================== */
#toast-box {
  position:fixed;
  bottom:24px; right:24px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.toast {
  background:var(--bg-card);
  border:1px solid #333;
  border-radius:10px;
  padding:14px 18px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:260px;
  max-width:380px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  animation:toastIn .28s ease;
}
.toast.ok  { border-left:3px solid var(--green); }
.toast.err { border-left:3px solid var(--red); }
.toast.wrn { border-left:3px solid var(--orange); }
.toast.inf { border-left:3px solid var(--blue); }
@keyframes toastIn  { from { transform:translateX(110%); opacity:0; } to { transform:none; opacity:1; } }
@keyframes toastOut { from { transform:none; opacity:1; } to { transform:translateX(110%); opacity:0; } }

/* ======================================================
   RESPONSIVE
====================================================== */
@media (max-width:900px) {
  .g4 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:1fr 1fr; }
  .nutri-totals { grid-template-columns:1fr 1fr; }
}
@media (max-width:768px) {
  #sidebar { display:none; }
  #bottom-nav { display:block; }
  #view { padding:16px 16px 80px; }
  #topbar { padding:0 16px; }
  .g2, .g3, .g4 { grid-template-columns:1fr; }
  .frow-2, .frow-3, .frow-4 { grid-template-columns:1fr; }
  .nutri-totals { grid-template-columns:1fr 1fr; }
  .modal { max-width:100%; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
  .modal-overlay { align-items:flex-end; padding:0; }
  .profile-hero { flex-direction:column; text-align:center; }
  .profile-actions { flex-direction:row; flex-wrap:wrap; justify-content:center; }
  #toast-box { left:16px; right:16px; bottom:80px; }
  .toast { min-width:unset; }
  .login-box { padding:32px 24px; }
}
@media (max-width:480px) {
  .topbar-title { font-size:20px; }
  .stat-val { font-size:32px; }
  .sec-title { font-size:20px; }
  .g2 { grid-template-columns:1fr; }
  .delta-grid { grid-template-columns:1fr 1fr; }
}

/* ======================================================
   MÓDULO 3 — ENTRENAMIENTO
====================================================== */
.plan-card {
  margin-bottom: 14px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border);
}
.plan-card--active {
  border-color: var(--green);
}
.plan-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  background: var(--bg-card);
  transition: background .15s;
  gap: 10px;
  flex-wrap: wrap;
}
.plan-card-header:hover { background: var(--bg-card2); }
.plan-card-title { font-size: 1rem; font-weight: 700; }
.plan-card-body  { padding: 0 16px 16px; background: var(--bg-card); }
.plan-card-chevron { color: var(--text-dim); font-size: .75rem; }

.day-section { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.day-sec-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  background: var(--bg-card2);
  transition: background .15s;
}
.day-sec-header:hover { background: var(--bg-card3); }
.day-sec-today { border-left: 3px solid var(--green); }

.day-type-badge { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.dtb-train  { background: rgba(0,255,102,.15); color: var(--green); }
.dtb-active { background: rgba(68,136,255,.15); color: var(--blue); }
.dtb-rest   { background: rgba(255,255,255,.08); color: var(--text-dim); }

/* Formulario de plan */
.day-form-sec { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.day-form-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card2);
  flex-wrap: wrap;
}
.day-form-name { font-weight: 700; min-width: 90px; }
.day-form-sec > div[id^="dfs-ex-"] { padding: 10px 14px 14px; }
.ex-table input, .ex-table select { background: var(--bg-card3); border: 1px solid var(--border); border-radius: 4px; color: var(--white); padding: 4px 6px; font-size: .8rem; }
.ex-table input:focus, .ex-table select:focus { outline: none; border-color: var(--green); }

/* Mi entrenamiento — checkboxes */
.ex-check-row {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--bg-card2);
  margin-bottom: 8px;
  transition: opacity .2s;
}
.ex-done { opacity: .5; text-decoration: line-through; }

.alert-banner {
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: .9rem;
}
.alert-warn { background: rgba(255,136,0,.12); border: 1px solid rgba(255,136,0,.3); color: var(--orange); }

/* ======================================================
   MÓDULO 4 — NUTRICIÓN
====================================================== */
/* Bloque de stats TMB/TDEE */
.nutri-auto-block { margin-bottom: 16px; }
.nutri-stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.nutri-stat-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg-card2);
  border-radius: var(--radius);
  padding: 10px 16px;
  min-width: 90px;
  flex: 1;
}
.nutri-stat-highlight { border: 1px solid var(--green); background: var(--green-dim); }
.nutri-stat-lbl  { font-size: .7rem; color: var(--text-dim); text-align:center; }
.nutri-stat-val  { font-size: 1.3rem; font-weight: 700; color: var(--white); }
.nutri-stat-unit { font-size: .7rem; color: var(--text-dim); }

/* Barras de macros */
.macro-bars { display: flex; flex-direction: column; gap: 8px; }
.macro-bar-row { display: flex; align-items: center; gap: 10px; }
.macro-bar-lbl  { width: 120px; font-size: .8rem; color: var(--text-dim); flex-shrink: 0; }
.macro-bar-track { flex: 1; background: var(--bg-card3); border-radius: 6px; height: 10px; overflow: hidden; }
.macro-bar-fill { height: 100%; border-radius: 6px; transition: width .4s; }
.mbf-pro  { background: var(--green); }
.mbf-carb { background: var(--blue); }
.mbf-fat  { background: var(--orange); }
.macro-bar-val { font-size: .8rem; width: 110px; text-align: right; flex-shrink:0; }

/* Preview macro en modal */
.nutri-macro-preview {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 4px 0 16px;
}
.nmp-item {
  flex: 1;
  min-width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: .8rem;
}
.nmp-item span { color: var(--text-dim); font-size: .72rem; }
.nmp-item b    { font-size: 1.1rem; }
.nmp-item small{ color: var(--text-dim); font-size: .7rem; }
.nmp-pro  { background: rgba(0,255,102,.10); border: 1px solid rgba(0,255,102,.2); }
.nmp-carb { background: rgba(68,136,255,.10); border: 1px solid rgba(68,136,255,.2); }
.nmp-fat  { background: rgba(255,136,0,.10);  border: 1px solid rgba(255,136,0,.2); }
.nmp-cal  { background: var(--bg-card2); border: 1px solid var(--border); }

/* Sección de comida */
.meal-section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.meal-type-icon { font-size: 1.1rem; }

/* Sección de comida en formulario */
.meal-form-sec { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.meal-form-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card2);
  cursor: pointer;
  flex-wrap: wrap;
}
.meal-form-name { font-weight: 700; flex: 1; min-width: 110px; }
.meal-toggle { display: flex; align-items: center; gap: 6px; font-size: .8rem; cursor: pointer; }

/* Notas especiales */
.nutri-notes-box {
  background: var(--bg-card2);
  border-left: 3px solid var(--green);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 12px 16px;
  margin: 12px 0;
}
.nutri-notes-box strong { font-size: .85rem; color: var(--green); display: block; margin-bottom: 4px; }
.nutri-notes-box p { margin: 0; font-size: .85rem; color: var(--text-dim); }

/* ======================================================
   MÓDULO 5 — AVANCES Y GRÁFICOS
====================================================== */
/* Tarjetas delta */
.prog-delta-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 4px;
}
@media (max-width:1100px) { .prog-delta-grid { grid-template-columns: repeat(3,1fr); } }
@media (max-width:600px)  { .prog-delta-grid { grid-template-columns: repeat(2,1fr); } }

.delta-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.delta-icon    { font-size: 1.5rem; line-height: 1; }
.delta-label   { font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
.delta-current { font-size: 1.4rem; font-weight: 700; color: var(--white); }
.delta-change  { font-size: .82rem; font-weight: 700; }
.delta-first   { font-size: .72rem; color: var(--text-dim); }
.delta-good    { color: var(--green); }
.delta-bad     { color: var(--red); }
.delta-neutral { color: var(--text-dim); }

/* Gráficos */
.chart-card  { padding: 14px 16px; }

<script>
'use strict';

/* ======================================================
   ESTADO GLOBAL
====================================================== */
const S = {
  role:    null,   // 'admin' | 'member'
  uid:     null,   // userId activo (rol miembro)
  view:    null,   // vista actual
  param:   null,   // parámetro de vista (userId, etc.)
  charts:  {}      // instancias Chart.js activas
};

/* ======================================================
   BASE DE DATOS — localStorage
====================================================== */
const DB = {
  // Usuarios / miembros
  users:    () => JSON.parse(localStorage.getItem('gp_users')   || '[]'),
  setUsers: (d) => localStorage.setItem('gp_users',   JSON.stringify(d)),
  user:     (id) => DB.users().find(u => u.id === id) || null,
  saveUser: (u)  => {
    const arr = DB.users();
    const i   = arr.findIndex(x => x.id === u.id);
    i >= 0 ? arr[i] = u : arr.push(u);
    DB.setUsers(arr);
  },
  delUser:  (id) => DB.setUsers(DB.users().filter(u => u.id !== id)),

  // Planes de entrenamiento
  plans:    () => JSON.parse(localStorage.getItem('gp_plans')   || '[]'),
  setPlans: (d) => localStorage.setItem('gp_plans',   JSON.stringify(d)),
  plan:     (id) => DB.plans().find(p => p.id === id) || null,
  userPlans:(uid) => DB.plans().filter(p => p.userId === uid),
  activePlan:(uid) => DB.plans().find(p => p.userId === uid && p.isActive) || null,
  savePlan: (p)  => {
    const arr = DB.plans();
    const i   = arr.findIndex(x => x.id === p.id);
    i >= 0 ? arr[i] = p : arr.push(p);
    DB.setPlans(arr);
  },
  delPlan:  (id) => DB.setPlans(DB.plans().filter(p => p.id !== id)),

  // Planes de nutrición
  nutris:    () => JSON.parse(localStorage.getItem('gp_nutri')  || '[]'),
  setNutris: (d) => localStorage.setItem('gp_nutri',  JSON.stringify(d)),
  nutri:     (id) => DB.nutris().find(p => p.id === id) || null,
  userNutris:(uid) => DB.nutris().filter(p => p.userId === uid),
  activeNutri:(uid) => DB.nutris().find(p => p.userId === uid && p.isActive) || null,
  saveNutri: (p)  => {
    const arr = DB.nutris();
    const i   = arr.findIndex(x => x.id === p.id);
    i >= 0 ? arr[i] = p : arr.push(p);
    DB.setNutris(arr);
  },
  delNutri:  (id) => DB.setNutris(DB.nutris().filter(p => p.id !== id)),

  // Alimentos personalizados
  foodCustom:    () => JSON.parse(localStorage.getItem('gp_food_custom') || '[]'),
  setFoodCustom: (d) => localStorage.setItem('gp_food_custom', JSON.stringify(d)),

  // Asistencia
  att:    () => JSON.parse(localStorage.getItem('gp_att')    || '[]'),
  setAtt: (d) => localStorage.setItem('gp_att',    JSON.stringify(d)),
  userAtt:(uid) => DB.att().filter(a => a.userId === uid),
  addAtt: (rec) => { const a = DB.att(); a.push(rec); DB.setAtt(a); },

  // Admin password
  adminPass:    () => localStorage.getItem('gp_apass') || 'GymPro2024',
  setAdminPass: (p) => localStorage.setItem('gp_apass', p),

  // Flag inicialización
  isInit: () => localStorage.getItem('gp_init') === '1',
  setInit: () => localStorage.setItem('gp_init', '1')
};

/* ======================================================
   UTILIDADES
====================================================== */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function today() { return new Date().toISOString().slice(0, 10); }
function nowTime() {
  const d = new Date();
  return d.toTimeString().slice(0,5);
}
function fDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
}
function fDateShort(s) {
  if (!s) return '—';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short' });
}
function daysUntil(s) {
  if (!s) return null;
  const n = new Date(); n.setHours(0,0,0,0);
  const t = new Date(s + 'T12:00:00');
  return Math.round((t - n) / 86400000);
}
function daysSince(s) {
  if (!s) return null;
  const n = new Date(); n.setHours(0,0,0,0);
  const t = new Date(s + 'T12:00:00');
  return Math.round((n - t) / 86400000);
}
function getAge(bdate) {
  if (!bdate) return null;
  const b = new Date(bdate + 'T12:00:00'), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}
function initials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length === 1 ? p[0][0].toUpperCase() : (p[0][0] + p[p.length-1][0]).toUpperCase();
}
function formatCOP(n) {
  if (!n && n !== 0) return '$0';
  return '$' + parseInt(n).toLocaleString('es-CO');
}
function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Estado de membresía
function memStatus(u) {
  if (!u.membership || !u.membership.endDate)
    return { s:'none', label:'Sin membresía', cls:'badge-gray', days:null, urgent:false };
  if (u.membership.status === 'suspended')
    return { s:'suspended', label:'Suspendida', cls:'badge-orange', days:null, urgent:false };
  const d = daysUntil(u.membership.endDate);
  if (d < 0)  return { s:'expired',  label:'Vencida',  cls:'badge-red',   days:d, urgent:false };
  if (d <= 5) return { s:'expiring', label:`Vence ${d}d`, cls:'badge-red badge-blink', days:d, urgent:true };
  return { s:'active', label:'Activa', cls:'badge-green', days:d, urgent:false };
}

// Descuento por antigüedad
function antiquityPct(joinDate) {
  if (!joinDate) return 0;
  const yrs = daysSince(joinDate) / 365;
  if (yrs >= 3) return 15;
  if (yrs >= 2) return 10;
  if (yrs >= 1) return 5;
  return 0;
}

// Cumpleaños esta semana (próximos 7 días)
function bdayThisWeek(bdate) {
  if (!bdate) return false;
  const n = new Date(); n.setHours(0,0,0,0);
  const b = new Date(bdate + 'T12:00:00');
  const next = new Date(n.getFullYear(), b.getMonth(), b.getDate());
  if (next < n) next.setFullYear(n.getFullYear() + 1);
  return (next - n) / 86400000 <= 7;
}

// IMC
function calcIMC(w, h) {
  if (!w || !h) return null;
  return parseFloat((w / Math.pow(h/100, 2)).toFixed(1));
}
function imcCat(v) {
  if (!v) return '';
  if (v < 18.5) return 'Bajo peso';
  if (v < 25)   return 'Normal';
  if (v < 30)   return 'Sobrepeso';
  if (v < 35)   return 'Obesidad I';
  return 'Obesidad II+';
}

// TMB Mifflin-St Jeor
function calcTMB(w, h, age, gender) {
  if (!w || !h || !age) return null;
  const base = 10*w + 6.25*h - 5*age;
  return Math.round(gender === 'M' ? base + 5 : base - 161);
}
function calcTDEE(tmb, level) {
  const f = { sedentary:1.2, low:1.375, moderate:1.55, active:1.725, very_active:1.9 };
  return Math.round(tmb * (f[level] || 1.2));
}
function targetMacros(tdee, obj) {
  const adj  = { lose_weight:-400, gain_muscle:400, maintenance:0, resistance:100, rehabilitation:0, sports_performance:200 };
  const dist = {
    lose_weight:        [0.40, 0.30, 0.30],
    gain_muscle:        [0.30, 0.50, 0.20],
    maintenance:        [0.30, 0.40, 0.30],
    resistance:         [0.25, 0.55, 0.20],
    rehabilitation:     [0.30, 0.40, 0.30],
    sports_performance: [0.30, 0.50, 0.20]
  };
  const cal = tdee + (adj[obj] || 0);
  const d   = dist[obj] || dist.maintenance;
  return {
    calories: cal,
    protein:  Math.round(cal * d[0] / 4),
    carbs:    Math.round(cal * d[1] / 4),
    fat:      Math.round(cal * d[2] / 9)
  };
}

// Semana para gráfico de asistencia
function weekLabel(dateStr) {
  const d  = new Date(dateStr + 'T12:00:00');
  const s  = new Date(d); s.setDate(d.getDate() - d.getDay() + 1);
  return s.toLocaleDateString('es-CO', { day:'2-digit', month:'short' });
}

/* ======================================================
   TOAST
====================================================== */
function toast(msg, type = 'ok') {
  const icons = { ok:'✅', err:'❌', wrn:'⚠️', inf:'ℹ️' };
  const box   = document.getElementById('toast-box');
  const t     = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${icons[type]||'●'}</span><span>${msg}</span>`;
  box.appendChild(t);
  setTimeout(() => {
    t.style.animation = 'toastOut .28s ease forwards';
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

/* ======================================================
   MODAL
====================================================== */
function showModal(html, size = '') {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal-ov';
  ov.innerHTML = `<div class="modal ${size}">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() {
  document.getElementById('modal-ov')?.remove();
}
function confirmDlg(msg, cb, title = 'Confirmar acción') {
  showModal(`
    <div class="modal-head">
      <span class="modal-title">⚠️ ${escH(title)}</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body"><p style="font-size:15px">${msg}</p></div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Confirmar</button>
    </div>
  `);
  document.getElementById('confirm-yes').onclick = () => { closeModal(); cb(); };
}

/* ======================================================
   AUTH — Login / Logout
====================================================== */
function setRole(role) {
  S._role = role;
  document.getElementById('tab-admin').classList.toggle('active',  role === 'admin');
  document.getElementById('tab-member').classList.toggle('active', role === 'member');
  document.getElementById('admin-fields').classList.toggle('hidden',  role !== 'admin');
  document.getElementById('member-fields').classList.toggle('hidden', role !== 'member');
  document.getElementById('login-error').style.display = 'none';
}

function doLogin() {
  const role = S._role || 'admin';
  console.log('[GymApp doLogin] role:', role,
    '| users in DB:', DB.users().length,
    '| adminPass:', DB.adminPass(),
    '| gp_init:', localStorage.getItem('gp_init'));
  document.getElementById('login-error').style.display = 'none';

  if (role === 'admin') {
    const user = document.getElementById('inp-user').value.trim();
    const pass = document.getElementById('inp-pass').value;
    console.log('[GymApp doLogin] admin attempt — user:', user, '| pass match:', pass === DB.adminPass());
    if (user === 'admin' && pass === DB.adminPass()) {
      S.role = 'admin'; S.uid = null;
      launchApp();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  } else {
    const ced = document.getElementById('inp-cedula').value.trim();
    const u   = DB.users().find(x => x.cedula === ced);
    console.log('[GymApp doLogin] member attempt — cedula:', ced, '| found:', !!u);
    if (u) {
      S.role = 'member'; S.uid = u.id;
      launchApp();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }
}

function launchApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  buildSidebar();
  navigate(S.role === 'admin' ? 'dashboard' : 'profile');
}

function logout() {
  // Destruir charts activos
  destroyCharts();
  S.role = null; S.uid = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display = 'flex';
  // Limpiar inputs
  ['inp-user','inp-pass','inp-cedula'].forEach(id => {
    const el = document.getElementById(id);

function filterMembers() {
  const search = (document.getElementById('mem-search')?.value || '').toLowerCase().trim();
  const filter = document.getElementById('mem-filter')?.value || '';
  const list   = document.getElementById('members-list');
  if (!list) return;

  let users = DB.users();
  if (search) {
    users = users.filter(u =>
      u.name.toLowerCase().includes(search) ||
      u.cedula.includes(search) ||
      (u.phone && u.phone.includes(search)) ||
      (u.email && u.email.toLowerCase().includes(search))
    );
  }
  if (filter) {
    users = users.filter(u => {
      const st = memStatus(u);
      if (filter === 'active')   return st.s === 'active';
      if (filter === 'expiring') return st.urgent;
      if (filter === 'expired')  return st.s === 'expired';
      if (filter === 'debt')     return u.debt && u.debt.amount > 0;
      if (filter === 'birthday') return bdayThisWeek(u.birthdate);
      return true;
    });
  }

  if (users.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-ico">👥</div><p class="empty-txt">No se encontraron miembros</p><p class="empty-sub">Intenta con otro filtro o búsqueda</p></div>`;
    return;
  }

  list.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    ${users.map(u => {
      const st   = memStatus(u);
      const disc = antiquityPct(u.joinDate);
      const age  = getAge(u.birthdate);
      const refU = u.referredBy ? DB.user(u.referredBy) : null;
      const trunk = (u.trunkBox || []).filter(t => !t.used).length;
      return `<div class="member-card" onclick="navigate('member-detail','${u.id}')">
        <div class="m-avatar">${initials(u.name)}</div>
        <div class="m-info">
          <div class="m-name">${escH(u.name)}</div>
          <div class="m-meta">CC: ${u.cedula}${u.phone ? ` • ${u.phone}` : ''}${age !== null ? ` • ${age} años` : ''}</div>
          <div class="m-meta">Ingreso: ${fDate(u.joinDate)}${refU ? ` • Ref: ${escH(refU.name.split(' ')[0])}` : ''}</div>
          <div class="m-badges">
            <span class="badge ${st.cls}">${st.label}</span>
            ${disc > 0 ? `<span class="badge badge-blue">${disc}% antigüedad</span>` : ''}
            ${u.debt && u.debt.amount > 0 ? `<span class="badge badge-orange">💰 ${formatCOP(u.debt.amount)}</span>` : ''}
            ${bdayThisWeek(u.birthdate) ? `<span class="badge badge-blue">🎂</span>` : ''}
            ${trunk > 0 ? `<span class="badge badge-gray">🗃️ ${trunk} baúl</span>` : ''}
          </div>
        </div>
        <div class="m-side">
          ${st.days !== null && st.days >= 0 ? `<div class="text-sm text-gray">${st.days}d restantes</div>` : ''}
          <div class="text-xs text-gray mt-8">${fDate(u.membership?.endDate)}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- Tab: Membresía ---------- */
function _membershipTab(u) {
  const st   = memStatus(u);
  const disc = antiquityPct(u.joinDate);
  const dLeft = u.membership?.endDate ? daysUntil(u.membership.endDate) : null;
  const sinceJoin = u.joinDate ? daysSince(u.joinDate) : 0;
  const yrs  = Math.floor(sinceJoin / 365);
  const mos  = Math.floor((sinceJoin % 365) / 30);

  // Progress bar: % del período actual consumido
  let barPct = 0;
  if (u.membership?.startDate && u.membership?.endDate) {
    const total = daysSince(u.membership.startDate) + Math.max(0, dLeft || 0);
    barPct = total > 0 ? Math.min(100, Math.round(daysSince(u.membership.startDate) / total * 100)) : 100;
  }
  const barCls = dLeft !== null && dLeft <= 5 ? 'pbar-red' : dLeft !== null && dLeft <= 15 ? 'pbar-orange' : 'pbar-green';

  const allUsers  = DB.users();

      <div style="display:flex;flex-direction:column;gap:12px">

        <div><div class="text-xs text-gray">TIEMPO EN EL GYM</div>
          <div class="fw-600">${yrs > 0 ? yrs + ' año' + (yrs>1?'s':'') + ' ' : ''}${mos > 0 ? mos + ' mes' + (mos>1?'es':'') : ''}${yrs===0 && mos===0 ? 'Menos de 1 mes' : ''}</div>
        </div>
        ${disc > 0
          ? `<div><div class="text-xs text-gray">DESCUENTO ANTIGÜEDAD</div>
              <div class="font-title text-green" style="font-size:32px">${disc}%</div>

          : `<div class="alert alert-info mb-0"><span class="alert-icon">ℹ️</span><span>Descuento: 5% al año, 10% a 2 años, 15% a 3 años</span></div>`}
        ${u.referralCount > 0 ? `<div><div class="text-xs text-gray">PUNTOS REFERIDOS</div><div class="font-title text-green" style="font-size:24px">${u.referralPoints || 0} pts</div></div>` : ''}

  <!-- Caja Baúl -->

    <div class="flex-b mb-16">

      <button class="btn btn-sm btn-outline-green" onclick="showAddTrunkBoxModal('${u.id}')">➕ Agregar</button>

      ${trunk.length > 0 ? `
      <div class="mb-16">

        <div style="display:flex;flex-direction:column;gap:8px">

      <button class="btn btn-sm btn-outline" onclick="showEditDebtModal('${u.id}')">✏️ Editar</button>

  </div>`;
}

/* ---------- Tab: Asistencia ---------- */
function _attendanceTab(u) {
  const att      = DB.userAtt(u.id);
  const todayStr = today();
  const todayRec = att.find(a => a.date === todayStr);
  const sorted   = [...att].sort((a, b) => b.date.localeCompare(a.date));
  const now      = new Date();

  const thisMonthAtt = att.filter(a => {
    const d = new Date(a.date + 'T12:00:00');
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const mon = new Date(now); mon.setDate(now.getDate() - now.getDay() + 1); mon.setHours(0,0,0,0);
  const thisWeekAtt  = att.filter(a => new Date(a.date + 'T12:00:00') >= mon);

  return `
  <div style="display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap">
    <div class="g3 flex-1 gap-16">
      <div class="stat-card" style="padding:16px">
        <div class="stat-lbl">Total</div>
        <div class="stat-val" style="font-size:28px">${att.length}</div>
      </div>
      <div class="stat-card" style="padding:16px">
        <div class="stat-lbl">Este mes</div>
        <div class="stat-val" style="font-size:28px">${thisMonthAtt.length}</div>
      </div>
      <div class="stat-card blue" style="padding:16px">
        <div class="stat-lbl">Esta semana</div>
        <div class="stat-val" style="font-size:28px;color:var(--blue)">${thisWeekAtt.length}</div>
      </div>
    </div>
    <div>
      ${todayRec
        ? `<div class="alert alert-success mb-0"><span class="alert-icon">✅</span>
            <div><div class="fw-600">Entrada registrada hoy</div><div class="text-sm">${todayRec.time}</div></div></div>`
        : `<button class="btn btn-green" onclick="registerAttendance('${u.id}')">⏰ Registrar Entrada Hoy</button>`}
    </div>
  </div>

  <div class="card">
    <div class="card-title">📅 Historial de Asistencias</div>
    ${sorted.length === 0
      ? `<p class="text-gray text-sm">Sin asistencias registradas.</p>`
      : `<div class="tbl-wrap"><table>
          <thead><tr><th>Fecha</th><th>Hora</th><th>Día</th></tr></thead>
          <tbody>${sorted.slice(0, 60).map(a => {
            const d = new Date(a.date + 'T12:00:00');
            const isToday = a.date === todayStr;
            return `<tr${isToday ? ' style="background:var(--green-dim2)"' : ''}>
              <td>${fDate(a.date)}${isToday ? ' <span class="badge badge-green">Hoy</span>' : ''}</td>
              <td class="text-green fw-600">${a.time}</td>
              <td class="text-gray text-sm">${d.toLocaleDateString('es-CO',{weekday:'long'})}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        ${sorted.length > 60 ? `<p class="text-gray text-sm mt-8">Últimas 60 de ${sorted.length} asistencias.</p>` : ''}`}
  </div>`;
}

/* ---------- Tab: Info Personal ---------- */
function _personalTab(u) {
  const OBJ_MAP = { lose_weight:'Bajar de peso', gain_muscle:'Ganar masa muscular',
    maintenance:'Mantenimiento', resistance:'Mejorar resistencia',
    rehabilitation:'Rehabilitación', sports_performance:'Rendimiento deportivo' };
  const ACT_MAP = { sedentary:'Sedentario', low:'Poco activo', moderate:'Moderado',
    active:'Activo', very_active:'Muy activo' };
  const EQP_MAP = { gym_only:'Solo gym', home_gym:'Casa + gym', home_only:'Solo casa' };

  const last   = u.physicalHistory?.length > 0 ? u.physicalHistory[u.physicalHistory.length - 1] : null;
  const imcVal = last ? calcIMC(last.weight, last.height) : null;

  return `
  <div class="g2 mb-20">
    <div class="card">
      <div class="card-title">👤 Datos Personales</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          ['Nombre completo', u.name],
          ['Cédula', u.cedula],
          ['Teléfono', u.phone || '—'],
          ['Email', u.email || '—'],
          ['Fecha nacimiento', u.birthdate ? `${fDate(u.birthdate)} (${getAge(u.birthdate)} años)` : '—'],
          ['Género', u.gender === 'M' ? '♂ Hombre' : u.gender === 'F' ? '♀ Mujer' : '—'],
          ['Ocupación', u.occupation || '—'],
          ['Horas trabajo/día', u.workHoursPerDay ? u.workHoursPerDay + 'h' : '—'],
          ['Horas sueño promedio', u.sleepHoursAvg ? u.sleepHoursAvg + 'h' : '—'],
          ['Nivel actividad previa', ACT_MAP[u.activityLevel] || '—'],
        ].map(([l,val]) => `<div class="flex-b">
          <div class="text-xs text-gray">${l.toUpperCase()}</div>
          <div class="fw-600 text-sm">${escH(String(val))}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎯 Objetivos</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          ['Objetivo principal', OBJ_MAP[u.objectives?.primary] || '—'],
          ['Objetivo secundario', u.objectives?.secondary || '—'],
          ['Días/semana disponibles', u.objectives?.daysPerWeek ? u.objectives.daysPerWeek + ' días' : '—'],
          ['Duración sesión deseada', u.objectives?.sessionDuration ? u.objectives.sessionDuration + ' min' : '—'],
          ['Equipo disponible', EQP_MAP[u.objectives?.equipment] || '—'],
        ].map(([l,val]) => `<div class="flex-b">
          <div class="text-xs text-gray">${l.toUpperCase()}</div>
          <div class="fw-600 text-sm">${escH(String(val))}</div>
        </div>`).join('')}
      </div>
      ${last ? `
      <hr class="sep">
      <div class="card-title" style="font-size:15px">⚖️ Última medición (${fDate(last.date)})</div>
      <div class="g2">
        <div class="tc"><div class="text-xs text-gray">PESO</div><div class="font-title text-green" style="font-size:28px">${last.weight} kg</div></div>
        <div class="tc"><div class="text-xs text-gray">IMC</div><div class="font-title" style="font-size:28px">${imcVal}</div><div class="text-xs text-gray">${imcCat(imcVal)}</div></div>
        <div class="tc"><div class="text-xs text-gray">% GRASA</div><div class="font-title" style="font-size:24px">${last.bodyFat}%</div></div>
        <div class="tc"><div class="text-xs text-gray">% MÚSCULO</div><div class="font-title text-green" style="font-size:24px">${last.muscleMass}%</div></div>
      </div>` : ''}
    </div>
  </div>

  ${u.medicalConditions && u.medicalConditions.length > 0 ? `
  <div class="card">
    <div class="card-title">⚕️ Condición Médica</div>
    <div class="g2">
      <div>
        <div class="text-xs text-gray mb-8">CONDICIONES</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${u.medicalConditions.map(c => `<span class="badge badge-red">${_medLabel(c)}</span>`).join('')}</div>
        ${u.medicalNotes ? `<div class="mt-12"><div class="text-xs text-gray">NOTAS</div><div class="text-sm mt-4">${escH(u.medicalNotes)}</div></div>` : ''}
      </div>
      <div>
        ${u.medications ? `<div><div class="text-xs text-gray">MEDICAMENTOS</div><div class="text-sm mt-4">${escH(u.medications)}</div></div>` : ''}
        ${u.hasSurgeries ? `<div class="mt-12"><div class="text-xs text-gray">CIRUGÍAS</div><div class="text-sm mt-4">${escH(u.surgeriesDesc || '—')}</div></div>` : ''}
      </div>
    </div>
  </div>` : ''}`;
}

function _medLabel(code) {
  const M = { hipertension:'Hipertensión', diabetes:'Diabetes', heart:'Problemas cardíacos',
    joint_injury:'Lesión articular', scoliosis:'Escoliosis', osteoporosis:'Osteoporosis',
    pregnancy:'Embarazo', cardiac:'Cardíaco' };
  return M[code] || code;
}

function saveMemberForm(isNew) {
  const name     = document.getElementById('fm-name').value.trim();
  const cedula   = document.getElementById('fm-cedula').value.trim();
  const joinDate = document.getElementById('fm-joindate').value;
  if (!name)    { toast('El nombre es obligatorio', 'err'); return; }
  if (!cedula)  { toast('La cédula es obligatoria', 'err'); return; }
  if (!joinDate){ toast('La fecha de ingreso es obligatoria', 'err'); return; }

  const existingId = document.getElementById('fm-id').value;
  const dupCheck   = DB.users().find(u => u.cedula === cedula && u.id !== existingId);
  if (dupCheck)  { toast('Ya existe un miembro con esa cédula', 'err'); return; }

  const prevUser = existingId ? DB.user(existingId) : null;
  const med      = Array.from(document.querySelectorAll('.med-chk:checked')).map(c => c.value);
  const refBy    = document.getElementById('fm-refby').value || null;

  const saved = {
    id:           existingId || uid(),
    name, cedula,
    phone:        document.getElementById('fm-phone').value.trim(),
    email:        document.getElementById('fm-email').value.trim(),
    birthdate:    document.getElementById('fm-bdate').value || null,
    gender:       document.getElementById('fm-gender').value,
    occupation:   document.getElementById('fm-occupation').value.trim(),
    workHoursPerDay: prevUser?.workHoursPerDay || 8,
    sleepHoursAvg:   prevUser?.sleepHoursAvg   || 7,
    activityLevel: document.getElementById('fm-activity').value,
    joinDate,
    membership: {
      status:    document.getElementById('fm-mstatus').value,
      type:      document.getElementById('fm-mtype').value,
      startDate: document.getElementById('fm-mstart').value,
      endDate:   document.getElementById('fm-mend').value
    },
    trunkBox:       prevUser?.trunkBox       || [],
    debt:           { amount: parseFloat(document.getElementById('fm-debt').value)||0,
                      description: document.getElementById('fm-debt-desc').value.trim() },
    referredBy:     refBy,
    referralPoints: prevUser?.referralPoints || 0,
    referralCount:  prevUser?.referralCount  || 0,
    medicalConditions: med,
    medicalNotes:   document.getElementById('fm-mednotes').value.trim(),
    medications:    document.getElementById('fm-meds').value.trim(),
    hasSurgeries:   document.getElementById('fm-surgery').value === 'true',
    surgeriesDesc:  document.getElementById('fm-surgerydesc').value.trim(),
    objectives: {
      primary:         document.getElementById('fm-obj').value,
      secondary:       prevUser?.objectives?.secondary || '',
      daysPerWeek:     parseInt(document.getElementById('fm-days').value) || 3,
      sessionDuration: parseInt(document.getElementById('fm-duration').value) || 60,
      equipment:       document.getElementById('fm-equip').value
    },
    physicalHistory: prevUser?.physicalHistory || []
  };

  // Si nuevo y tiene referido → sumar puntos al referidor
  if (isNew && refBy) {
    const ref = DB.user(refBy);
    if (ref) {
      ref.referralPoints = (ref.referralPoints || 0) + 50;
      ref.referralCount  = (ref.referralCount  || 0) + 1;
      DB.saveUser(ref);
    }
  }

  DB.saveUser(saved);
  closeModal();
  toast(isNew ? '✅ Miembro registrado' : '✅ Cambios guardados', 'ok');
  navigate('member-detail', saved.id);
}

function confirmDeleteMember(id) {
  const u = DB.user(id);
  if (!u) return;
  confirmDlg(`¿Eliminar a <strong>${escH(u.name)}</strong>? Esta acción no se puede deshacer. Se eliminarán también sus planes y registros.`, () => {
    DB.userPlans(id).forEach(p => DB.delPlan(p.id));
    DB.userNutris(id).forEach(n => DB.delNutri(n.id));
    DB.delUser(id);
    toast('Miembro eliminado', 'wrn');
    navigate('members');
  }, 'Eliminar Miembro');
}

function saveTrunkBox(userId) {
  const u = DB.user(userId); if (!u) return;
  if (!u.trunkBox) u.trunkBox = [];
  u.trunkBox.push({ id:uid(), type:document.getElementById('tb-type').value,
    months:parseInt(document.getElementById('tb-months').value)||1, addedDate:today(), used:false });
  DB.saveUser(u); closeModal();
  toast('Membresía agregada al baúl ✅', 'ok');
  navigate('member-detail', userId);
}

function useTrunkItem(userId, tbId) {
  const u = DB.user(userId); if (!u) return;
  const item = u.trunkBox?.find(t => t.id === tbId); if (!item) return;
  confirmDlg(`¿Activar la membresía <strong>${escH(item.type)}</strong> (${item.months} mes${item.months>1?'es':''}) del baúl?`, () => {
    const startDate = today();
    const end = new Date(startDate + 'T12:00:00');
    end.setMonth(end.getMonth() + item.months);
    const endDate = end.toISOString().slice(0, 10);
    u.membership = { ...u.membership, status:'active', type:item.type, startDate, endDate };
    item.used = true;
    DB.saveUser(u);
    toast(`Membresía activa hasta ${fDate(endDate)} ✅`, 'ok');
    navigate('member-detail', userId);
  }, 'Usar Membresía del Baúl');
}

function filterValList() {
  const search = (document.getElementById('val-search')?.value || '').toLowerCase().trim();
  const filter = document.getElementById('val-filter')?.value || '';
  const list   = document.getElementById('val-list');
  if (!list) return;

  let users = DB.users();
  if (search) users = users.filter(u => u.name.toLowerCase().includes(search) || u.cedula.includes(search));
  if (filter === 'with')    users = users.filter(u => u.physicalHistory?.length > 0);
  if (filter === 'without') users = users.filter(u => !u.physicalHistory?.length);

  if (!users.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-ico">📋</div><p class="empty-txt">Sin resultados</p></div>`;
    return;
  }
  list.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    ${users.map(u => {
      const last   = u.physicalHistory?.length ? u.physicalHistory[u.physicalHistory.length - 1] : null;
      const imcVal = last ? calcIMC(last.weight, last.height) : null;
      const medW   = (u.medicalConditions || []).length;

        <div class="m-avatar">${initials(u.name)}</div>
        <div class="m-info">
          <div class="m-name">${escH(u.name)}</div>
          <div class="m-meta">CC: ${u.cedula} • ${u.gender === 'M' ? '♂' : u.gender === 'F' ? '♀' : '—'} • ${getAge(u.birthdate) || '—'} años</div>
          <div class="m-badges">
            ${last
              ? `<span class="badge badge-green">✅ ${u.physicalHistory.length} med${u.physicalHistory.length > 1 ? 'iciones' : 'ición'}</span>
                 <span class="badge badge-gray">Última: ${fDateShort(last.date)}</span>
                 <span class="badge badge-blue">IMC ${imcVal} — ${imcCat(imcVal)}</span>`
              : `<span class="badge badge-orange">⚠️ Sin mediciones</span>`}
            ${medW > 0 ? `<span class="badge badge-red">⚕️ ${medW} cond.</span>` : ''}
          </div>
        </div>
        <div class="m-side">
          ${last ? `<div class="font-title text-green" style="font-size:22px">${last.weight} kg</div>
                    <div class="text-xs text-gray">${last.height} cm</div>` : ''}
        </div>

function switchValTab(tab) {
  document.querySelectorAll('#val-tabs .tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));

    const el = document.getElementById('val-' + t);
    if (el) el.classList.toggle('active', t === tab);
  });
}

/* ---------- Tab: Datos Físicos ---------- */
function _valFisicaTab(u) {
  const hist   = u.physicalHistory || [];
  const last   = hist.length ? hist[hist.length - 1] : null;
  const first  = hist.length ? hist[0] : null;
  const imcVal = last ? calcIMC(last.weight, last.height) : null;
  const imcCls = !imcVal ? '' : imcVal < 18.5 ? 'text-blue' : imcVal < 25 ? 'text-green' : imcVal < 30 ? 'text-orange' : 'text-red';

  // Delta primera vs última medición
  const delta = (key, sub) => {
    if (!first || !last) return null;
    const a = sub ? first[sub]?.[key] : first[key];
    const b = sub ? last[sub]?.[key]  : last[key];
    if (a == null || b == null) return null;
    return parseFloat((b - a).toFixed(1));
  };

  const dWeight = delta('weight');
  const dFat    = delta('bodyFat');
  const dMuscle = delta('muscleMass');
  const dWaist  = delta('waist','measures');

  return `
  <!-- Resumen última medición -->
  ${last ? `
  <div class="g4 mb-20">
    <div class="stat-card">
      <div class="stat-lbl">Peso actual</div>
      <div class="stat-val">${last.weight}<span style="font-size:18px"> kg</span></div>
      ${dWeight !== null ? `<div class="stat-sub ${dWeight < 0 ? 'text-green' : dWeight > 0 ? 'text-orange' : ''}">${dWeight > 0 ? '+' : ''}${dWeight} kg desde inicio</div>` : ''}
    </div>
    <div class="stat-card">
      <div class="stat-lbl">IMC</div>
      <div class="stat-val ${imcCls}">${imcVal}</div>
      <div class="stat-sub">${imcCat(imcVal)}</div>
    </div>
    <div class="stat-card red">
      <div class="stat-lbl">% Grasa corporal</div>
      <div class="stat-val">${last.bodyFat}<span style="font-size:18px">%</span></div>
      ${dFat !== null ? `<div class="stat-sub ${dFat < 0 ? 'text-green' : 'text-orange'}">${dFat > 0 ? '+' : ''}${dFat}% desde inicio</div>` : ''}
    </div>
    <div class="stat-card">
      <div class="stat-lbl">% Masa muscular</div>
      <div class="stat-val">${last.muscleMass}<span style="font-size:18px">%</span></div>
      ${dMuscle !== null ? `<div class="stat-sub ${dMuscle > 0 ? 'text-green' : 'text-orange'}">${dMuscle > 0 ? '+' : ''}${dMuscle}% desde inicio</div>` : ''}
    </div>
  </div>

  <!-- Medidas corporales + FC -->
  <div class="g2 mb-20">
    <div class="card">
      <div class="card-title">📏 Medidas Corporales <span class="text-xs text-gray fw-600" style="font-family:'Barlow'">(${fDate(last.date)})</span></div>
      <div class="g2">
        ${[['Pecho','chest'],['Cintura','waist'],['Cadera','hip'],['Brazo Der.','rArm'],
           ['Brazo Izq.','lArm'],['Muslo Der.','rThigh'],['Muslo Izq.','lThigh']].map(([lbl, key]) => {
          const val  = last.measures?.[key];
          const dVal = delta(key, 'measures');
          return `<div>
            <div class="text-xs text-gray">${lbl.toUpperCase()}</div>
            <div class="fw-600">${val != null ? val + ' cm' : '—'}</div>
            ${dVal !== null ? `<div class="text-xs ${dVal < 0 ? 'text-green' : dVal > 0 ? 'text-orange' : 'text-gray'}">${dVal > 0 ? '+' : ''}${dVal} cm</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">❤️ Datos Vitales</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <div class="text-xs text-gray">FC EN REPOSO</div>
          <div class="font-title" style="font-size:32px">${last.restHR || '—'} <span class="text-sm text-gray fw-600" style="font-family:'Barlow'">ppm</span></div>
          ${last.restHR ? `<div class="text-xs text-gray">${last.restHR < 60 ? '✅ Atlético' : last.restHR < 80 ? '✅ Normal' : '⚠️ Elevado'}</div>` : ''}
        </div>
        <div>
          <div class="text-xs text-gray">ESTATURA</div>
          <div class="font-title" style="font-size:28px">${last.height} <span class="text-sm text-gray fw-600" style="font-family:'Barlow'">cm</span></div>
        </div>
        <div>
          <div class="text-xs text-gray">TOTAL MEDICIONES</div>
          <div class="font-title text-green" style="font-size:28px">${hist.length}</div>
        </div>
      </div>
    </div>
  </div>` : `
  <div class="alert alert-info mb-20">
    <span class="alert-icon">ℹ️</span>
    <span>Este miembro no tiene mediciones registradas. Agrega la primera usando el botón de abajo.</span>
  </div>`}

  <!-- Botón agregar medición -->
  <div class="flex-b mb-20">
    <div class="sec-title" style="font-size:18px">HISTORIAL DE MEDICIONES (${hist.length})</div>
    <button class="btn btn-green" onclick="showAddMeasurementModal('${u.id}')">➕ Nueva Medición</button>
  </div>

  <!-- Tabla historial -->
  ${hist.length === 0 ? `<p class="text-gray text-sm">Sin mediciones registradas aún.</p>` : `
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Fecha</th><th>Peso (kg)</th><th>Talla (cm)</th><th>IMC</th>
        <th>% Grasa</th><th>% Músculo</th><th>Cintura</th><th>Brazo D.</th><th>Muslo D.</th><th>FC Rep.</th><th></th>
      </tr></thead>
      <tbody>
        ${[...hist].reverse().map((m, i) => {
          const imcM = calcIMC(m.weight, m.height);
          const isLast = i === 0;
          return `<tr${isLast ? ' style="background:var(--green-dim2)"' : ''}>
            <td>${fDate(m.date)}${isLast ? ' <span class="badge badge-green">Última</span>' : ''}</td>
            <td class="fw-600">${m.weight}</td>
            <td>${m.height}</td>
            <td><span class="fw-600 ${imcM < 18.5 ? 'text-blue' : imcM < 25 ? 'text-green' : imcM < 30 ? 'text-orange' : 'text-red'}">${imcM}</span></td>
            <td>${m.bodyFat}%</td>
            <td class="text-green">${m.muscleMass}%</td>
            <td>${m.measures?.waist || '—'} cm</td>
            <td>${m.measures?.rArm || '—'} cm</td>
