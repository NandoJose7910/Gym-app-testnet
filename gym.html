function _exRowInner(ex, n) {
  const muscles = ['Pecho','Espalda','Hombros','Bíceps','Tríceps','Antebrazos',
    'Abdomen','Cuádriceps','Isquiotibiales','Glúteos','Pantorrillas','Cuerpo completo','Cardio'];
  return `<tr>
    <td class="ex-num">${n+1}</td>
    <td><input class="ex-name" value="${escH(ex?ex.name:'')}" placeholder="Nombre ejercicio" style="min-width:150px"></td>
    <td>
      <select class="ex-muscle">
        ${muscles.map(m=>`<option ${(ex&&ex.muscle===m)?'selected':''}>${m}</option>`).join('')}
      </select>
    </td>
    <td><input class="ex-sets" type="number" min="1" max="20" value="${ex?ex.sets:3}" style="width:60px"></td>
    <td><input class="ex-reps" value="${escH(ex?String(ex.reps):'8-12')}" style="width:80px"></td>
    <td><input class="ex-weight" type="number" min="0" step="0.5" value="${ex?ex.weight:0}" style="width:80px"></td>
    <td><input class="ex-rest" type="number" min="10" max="600" value="${ex?ex.rest:60}" style="width:80px"></td>
    <td><input class="ex-notes" value="${escH(ex?ex.notes:'')}" placeholder="Opcional" style="min-width:100px"></td>
    <td><button class="btn btn-sm btn-danger" onclick="removeExRow(this)" style="padding:2px 8px">✕</button></td>
  </tr>`;
}

function toggleDayType(i) {
  const val = document.getElementById('dfs-type-'+i).value;
  document.getElementById('dfs-ex-'+i).style.display = val==='training' ? 'block' : 'none';
}

function addExRow(i) {
  const tbody = document.getElementById('extb-'+i);
  const n     = tbody.querySelectorAll('tr').length;
  tbody.insertAdjacentHTML('beforeend', _exRowInner(null, n));
  _renumberRows(tbody);
}

function removeExRow(btn) {
  const tr    = btn.closest('tr');
  const tbody = tr.closest('tbody');
  tr.remove();
  _renumberRows(tbody);
}

function _renumberRows(tbody) {
  tbody.querySelectorAll('tr').forEach((tr,i) => {
    const cell = tr.querySelector('.ex-num');
    if (cell) cell.textContent = i+1;
  });
}

function _getExercises(dayIdx) {
  const tbody = document.getElementById('extb-'+dayIdx);
  if (!tbody) return [];
  return Array.from(tbody.querySelectorAll('tr')).map((tr,n) => ({
    num:    n+1,
    name:   tr.querySelector('.ex-name').value.trim(),
    muscle: tr.querySelector('.ex-muscle').value,
    sets:   parseInt(tr.querySelector('.ex-sets').value)||3,
    reps:   tr.querySelector('.ex-reps').value.trim()||'8-12',
    weight: parseFloat(tr.querySelector('.ex-weight').value)||0,
    rest:   parseInt(tr.querySelector('.ex-rest').value)||60,
    notes:  tr.querySelector('.ex-notes').value.trim()
  })).filter(ex=>ex.name);
}

function savePlanForm(userId, planId) {
  const name  = document.getElementById('pf-name').value.trim();
  const weeks = parseInt(document.getElementById('pf-weeks').value)||8;
  if (!name) { toast('Ingresa un nombre para el plan','warn'); return; }

  const days = DAY_NAMES.map((_, i) => {
    const typeVal = document.getElementById('dfs-type-'+i).value;
    if (typeVal === 'training') {
      return { dayName: DAY_NAMES[i], type:'training', restType:null, exercises: _getExercises(i) };
    } else {
      return { dayName: DAY_NAMES[i], type:'rest', restType: typeVal==='rest_active'?'active':'total', exercises:[] };
    }
  });

  const plans = DB.plans();
  if (planId) {
    const idx = plans.findIndex(p=>p.id===planId);
    if (idx>=0) {
      plans[idx] = { ...plans[idx], name, durationWeeks:weeks, days };
      DB.setPlans(plans);
      toast('Plan actualizado ✅','ok');
    }
  } else {
    const newPlan = {
      id: uid(), userId, name, durationWeeks: weeks,
      createdAt: new Date().toISOString().slice(0,10),
      isActive: plans.filter(p=>p.userId===userId).length===0,
      days
    };
    plans.push(newPlan);
    DB.setPlans(plans);
    toast('Plan creado ✅','ok');
  }
  closePlanModal();
  navigate('train-detail', userId);
}

function closePlanModal() {
  const el = document.getElementById('train-modal');
  if (el) el.remove();
}

function setPlanActive(planId, userId) {
  const plans = DB.plans().map(p => p.userId===userId ? { ...p, isActive: p.id===planId } : p);
  DB.setPlans(plans);
  toast('Plan activado ✅','ok');
  navigate('train-detail', userId);
}

function deletePlanConfirm(planId, userId) {
  if (!confirm('¿Eliminar este plan de entrenamiento? Esta acción no se puede deshacer.')) return;
  DB.setPlans(DB.plans().filter(p=>p.id!==planId));
  toast('Plan eliminado','ok');
  navigate('train-detail', userId);
}

/* ---------- Tarjeta de plan (sólo lectura) ---------- */
function _nutriPlanCardHTML(plan, u) {
  const totalPro  = plan.meals.reduce((s,m)=>s+m.items.reduce((ss,i)=>ss+i.protein,0),0);
  const totalCarb = plan.meals.reduce((s,m)=>s+m.items.reduce((ss,i)=>ss+i.carbs,0),0);

  const cPct = totalCal>0?Math.round(totalCarb*4/totalCal*100):0;
  const fPct = totalCal>0?Math.round(totalFat*9/totalCal*100):0;
  const activeMeals = plan.meals.filter(m=>m.active&&m.items.length>0);

  return `
<div class="card plan-card ${plan.isActive?'plan-card--active':''}" id="npc-${plan.id}">
  <div class="plan-card-header" onclick="togglePlanCard('${plan.id}')">
    <div>
      <span class="plan-card-title">${escH(plan.name)}</span>
      ${plan.isActive?`<span class="badge badge-ok" style="margin-left:8px">Activo</span>`:`<span class="badge badge-dim" style="margin-left:8px">Inactivo</span>`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap">
      <span style="font-size:.8rem;color:var(--green);font-weight:700">${plan.calories} kcal</span>
      <span style="font-size:.8rem;color:var(--text-dim)">P:${plan.protein}g · C:${plan.carbs}g · G:${plan.fat}g</span>
      ${S.role==='admin'?`
        <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();showEditNutriModal('${plan.id}','${u.id}')">Editar</button>
        ${!plan.isActive?`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();setNutriActive('${plan.id}','${u.id}')">Activar</button>`:''}
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteNutriConfirm('${plan.id}','${u.id}')">Eliminar</button>`:''}
      <span class="plan-card-chevron" id="chev-${plan.id}">▼</span>
    </div>
  </div>
  <div class="plan-card-body" id="pcb-${plan.id}" style="display:none">
    <p style="font-size:.8rem;color:var(--text-dim);margin-bottom:14px">Creado: ${fDate(plan.createdAt)}</p>

    <!-- Barras de macros -->

      <div class="macro-bar-row">
        <span class="macro-bar-lbl">Proteína</span>
        <div class="macro-bar-track"><div class="macro-bar-fill mbf-pro" style="width:${pPct}%"></div></div>
        <span class="macro-bar-val">${totalPro}g (${pPct}%)</span>
      </div>
      <div class="macro-bar-row">
        <span class="macro-bar-lbl">Carbohidratos</span>
        <div class="macro-bar-track"><div class="macro-bar-fill mbf-carb" style="width:${cPct}%"></div></div>
        <span class="macro-bar-val">${totalCarb}g (${cPct}%)</span>
      </div>
      <div class="macro-bar-row">
        <span class="macro-bar-lbl">Grasas</span>
        <div class="macro-bar-track"><div class="macro-bar-fill mbf-fat" style="width:${fPct}%"></div></div>
        <span class="macro-bar-val">${totalFat}g (${fPct}%)</span>
      </div>
      <div class="macro-bar-row">
        <span class="macro-bar-lbl">Total real</span>
        <div style="flex:1"></div>
        <span class="macro-bar-val" style="color:var(--green);font-weight:700">${totalCal} kcal</span>
      </div>
    </div>

    <!-- Comidas -->
    ${activeMeals.length===0?'<p style="color:var(--text-dim)">Sin comidas definidas</p>':
      activeMeals.map(meal=>`
      <div style="margin-bottom:14px">
        <div class="meal-section-header">
          <span class="meal-type-icon">${_mealIcon(meal.type)}</span>
          <strong>${escH(meal.type)}</strong>
          <span style="font-size:.78rem;color:var(--text-dim);margin-left:auto">
            ${meal.items.reduce((s,i)=>s+i.protein,0)}P · ${meal.items.reduce((s,i)=>s+i.carbs,0)}C · ${meal.items.reduce((s,i)=>s+i.fat,0)}G · <b style="color:var(--green)">${meal.items.reduce((s,i)=>s+i.calories,0)} kcal</b>
          </span>
        </div>
        <table class="data-table" style="margin-top:6px">
          <thead><tr><th>Alimento</th><th>Cantidad</th><th>Prot(g)</th><th>Carbs(g)</th><th>Grasas(g)</th><th>Kcal</th><th>Notas</th></tr></thead>
          <tbody>
            ${meal.items.map(it=>`<tr>
              <td>${escH(it.food)}</td>

</div>`;

  if (last && u.birthdate) {
    const age  = Math.floor((new Date()-new Date(u.birthdate+'T00:00:00'))/31557600000);
    const tmb  = calcTMB(last.weight, last.height, age, u.gender||'M');
    if (tmb) {

function autoCalcKcal(inp) {
  const row  = inp.closest('tr');
  const pro  = parseFloat(row.querySelector('.mi-pro').value)||0;
  const carb = parseFloat(row.querySelector('.mi-carb').value)||0;
  const fat  = parseFloat(row.querySelector('.mi-fat').value)||0;
  const kcal = Math.round(pro*4 + carb*4 + fat*9);
  row.querySelector('.mi-kcal').value = kcal || '';
}

function updateMealTotals(mi) {
  const tbody = document.getElementById('mftb-'+mi);
  if (!tbody) return;
  let pro=0, carb=0, fat=0, cal=0;
  tbody.querySelectorAll('tr').forEach(tr => {
    pro  += parseFloat(tr.querySelector('.mi-pro')?.value)||0;
    carb += parseFloat(tr.querySelector('.mi-carb')?.value)||0;
    fat  += parseFloat(tr.querySelector('.mi-fat')?.value)||0;
    cal  += parseFloat(tr.querySelector('.mi-kcal')?.value)||0;
  });
  const el = document.getElementById('mfs-total-'+mi);
  if (el) el.textContent = `P:${Math.round(pro)}g · C:${Math.round(carb)}g · G:${Math.round(fat)}g · ${Math.round(cal)} kcal`;
  _updateGrandTotal();
}

function _updateGrandTotal() {
  let total=0;
  MEAL_TYPES.forEach((_,mi)=>{
    const tbody = document.getElementById('mftb-'+mi);
    if (!tbody) return;
    tbody.querySelectorAll('.mi-kcal').forEach(inp => { total += parseFloat(inp.value)||0; });
  });
  const el = document.getElementById('nf-grand-total');
  if (el) el.textContent = total>0 ? `Total real del plan: ${Math.round(total)} kcal` : '';
}

function addMealItem(mi) {
  const tbody = document.getElementById('mftb-'+mi);

function removeMealItem(btn, mi) {

function toggleMealActive(mi) {

function saveNutriForm(userId, planId) {
  const name = document.getElementById('nf-name').value.trim();
  if (!name) { toast('Ingresa un nombre para el plan','warn'); return; }
  const calories = parseInt(document.getElementById('nf-cal').value)||0;
  const protein  = parseInt(document.getElementById('nf-pro').value)||0;
  const carbs    = parseInt(document.getElementById('nf-carb').value)||0;
  const fat      = parseInt(document.getElementById('nf-fat').value)||0;
  const notes    = document.getElementById('nf-notes').value.trim();

  const meals = MEAL_TYPES.map((type,mi)=>({
    type,
    active: document.getElementById('mfs-active-'+mi)?.checked||false,
    items:  _getMealItems(mi)
  }));

  const supplements = Array.from(document.querySelectorAll('#supp-tbody tr')).map(tr=>({
    name:     tr.querySelector('.supp-name').value.trim(),
    dose:     tr.querySelector('.supp-dose').value.trim(),
    schedule: tr.querySelector('.supp-sch').value.trim()
  })).filter(s=>s.name);

  const nutris = DB.nutris();
  if (planId) {
    const idx = nutris.findIndex(n=>n.id===planId);
    if (idx>=0) { nutris[idx]={...nutris[idx], name, calories, protein, carbs, fat, meals, supplements, specialNotes:notes}; }
    DB.setNutris(nutris);
    toast('Plan actualizado ✅','ok');
  } else {
    const newPlan = {
      id: uid(), userId, name, createdAt: new Date().toISOString().slice(0,10),
      isActive: nutris.filter(n=>n.userId===userId).length===0,
      calories, protein, carbs, fat, meals, supplements, specialNotes: notes
    };
    nutris.push(newPlan);
    DB.setNutris(nutris);
    toast('Plan de nutrición creado ✅','ok');
  }
  closeNutriModal();
  navigate('nutri-detail', userId);
}

  const el = document.getElementById('nutri-modal');
  if (el) el.remove();
}

function setNutriActive(planId, userId) {
  DB.setNutris(DB.nutris().map(n=>n.userId===userId?{...n,isActive:n.id===planId}:n));
  toast('Plan activado ✅','ok');
  navigate('nutri-detail', userId);

  DB.setNutris(DB.nutris().filter(n=>n.id!==planId));
  toast('Plan eliminado','ok');
  navigate('nutri-detail', userId);

/* ---------- Tarjeta delta ---------- */
function _deltaCard(label, icon, firstVal, lastVal, unit, lowerIsBetter) {
  if (firstVal == null || lastVal == null) {
    return `<div class="delta-card"><div class="delta-icon">${icon}</div>
      <div class="delta-label">${label}</div>
      <div class="delta-current">—</div>
      <div class="delta-change" style="color:var(--text-dim)">Sin datos</div></div>`;
  }
  const delta = Math.round((lastVal - firstVal)*10)/10;
  const improved = lowerIsBetter ? delta < 0 : delta > 0;
  const neutral  = delta === 0;
  const sign     = delta > 0 ? '+' : '';
  const cls      = neutral ? 'delta-neutral' : improved ? 'delta-good' : 'delta-bad';
  return `<div class="delta-card">
    <div class="delta-icon">${icon}</div>
    <div class="delta-label">${label}</div>
    <div class="delta-current">${lastVal}${unit}</div>
    <div class="delta-change ${cls}">${sign}${delta}${unit} total</div>
    <div class="delta-first">Inicio: ${firstVal}${unit}</div>
  </div>`;
}

/* ---------- Export CSV ---------- */
function exportProgressCSV(userId) {
  const u    = DB.user(userId);
  if (!u) return;
  const hist = u.physicalHistory||[];
  if (!hist.length) { toast('Sin datos para exportar','warn'); return; }
  const headers = ['Fecha','Peso(kg)','%Grasa','%Músculo','Cintura(cm)','Cadera(cm)',
    'Pecho(cm)','Brazo D(cm)','Brazo I(cm)','Muslo D(cm)','Muslo I(cm)','FC Reposo(bpm)'];
  const rows = hist.map(h=>[
    h.date, h.weight, h.bodyFat??'', h.muscleMass??'',
    h.measures?.waist??'', h.measures?.hip??'', h.measures?.chest??'',
    h.measures?.rArm??'', h.measures?.lArm??'',
    h.measures?.rThigh??'', h.measures?.lThigh??'',
    h.restHR??''
  ]);
  const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `avances_${u.cedula}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exportado ✅','ok');
}

  }
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  // Chart.js 4: destroy any existing instance on this canvas element
  try { const ex = Chart.getChart(canvas); if (ex) ex.destroy(); } catch(e){}
  if (S.charts[canvasId]) { try { S.charts[canvasId].destroy(); } catch(e){} }
  const chart = new Chart(canvas, { type, data, options });
  S.charts[canvasId] = chart;
}

/* ---------- Gráfico 4: Asistencias por semana ---------- */
function _drawAttendanceChart(userId) {
  const att = DB.userAtt(userId);

  // Construir últimas 12 semanas
  const weeks = [];
  const now   = new Date();
  for (let i=11; i>=0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - d.getDay() + 1 - i*7); // lunes de la semana
    const start = d.toISOString().slice(0,10);
    const d2 = new Date(d); d2.setDate(d.getDate()+6);
    const end = d2.toISOString().slice(0,10);
    const label = d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
    const count = att.filter(a=>a.date>=start&&a.date<=end).length;
    weeks.push({ label, count });
  }

  _mkChart('chart-attendance','bar',{
    labels: weeks.map(w=>w.label),
    datasets:[{
      label:'Sesiones',
      data: weeks.map(w=>w.count),
      backgroundColor: weeks.map(w=>w.count>=4?'rgba(0,255,102,.7)':w.count>=2?'rgba(68,136,255,.7)':'rgba(255,136,0,.5)'),
      borderColor: weeks.map(w=>w.count>=4?'#00FF66':w.count>=2?'#4488ff':'#ff8800'),
      borderWidth:1, borderRadius:4
    }]
  },{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:'#aaa'}},
      tooltip:{
        backgroundColor:_chartDefaults.tooltipBg,
        borderColor:_chartDefaults.tooltipBorder,
        borderWidth:1,
        titleColor:'#00FF66',
        bodyColor:'#ccc',
        callbacks:{ label: ctx=>` ${ctx.parsed.y} sesión${ctx.parsed.y!==1?'es':''}` }

/* ---------- Gráfico: Volumen total por sesión ---------- */
function _drawVolumeChart(userId) {
  const logs = DB.userWlogs(userId).sort((a,b)=>a.date.localeCompare(b.date));
  if (!logs.length) return;
  const labels  = logs.map(l => fDate(l.date));
  const volumes = logs.map(l => {
    let v = 0;
    l.exercises.forEach(e => {
      (e.sets||[]).forEach(s => { v += (s.reps||0) * (s.weight||0); });
    });
    return Math.round(v);
  });
  _mkChart('chart-volume','line',{
    labels,

/* ---------- Gráfico: Primera vs última sesión por ejercicio ---------- */
function _drawExCompareChart(userId) {
  const logs = DB.userWlogs(userId).sort((a,b)=>a.date.localeCompare(b.date));
  if (logs.length < 2) return;
  const first = logs[0];
  const last  = logs[logs.length-1];
  const getMaxW = (exList, name) => {
    const ex = exList.find(e => e.name === name);
    if (!ex) return 0;
    return Math.max(...(ex.sets||[]).map(s=>s.weight||0), 0);
  };
  const exNames = [...new Set(
    [...first.exercises, ...last.exercises]
      .filter(e=>(e.sets||[]).some(s=>s.weight>0)).map(e=>e.name)
  )].slice(0,7);
  if (!exNames.length) return;
  const firstWeights = exNames.map(n => getMaxW(first.exercises, n));
  const lastWeights  = exNames.map(n => getMaxW(last.exercises, n));
  const shortNames   = exNames.map(n => n.length>18 ? n.slice(0,17)+'…' : n);
  _mkChart('chart-ex-compare','bar',{
    labels: shortNames,
    datasets:[
      { label:'Primera sesión', data:firstWeights,
        backgroundColor:'rgba(255,136,0,.6)', borderColor:'#ff8800', borderWidth:1, borderRadius:3 },
      { label:'Última sesión',  data:lastWeights,
        backgroundColor:'rgba(0,255,102,.6)', borderColor:'#00FF66', borderWidth:1, borderRadius:3 }
    ]
  },{
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:'#aaa'}},
      tooltip:{ backgroundColor:_chartDefaults.tooltipBg, borderColor:_chartDefaults.tooltipBorder,
        borderWidth:1, titleColor:'#ccc', bodyColor:'#ccc',
        callbacks:{ label: ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y} kg` }

function toggleExDone(cb, key, row) {
  localStorage.setItem(key, cb.checked ? '1' : '0');
  if (cb.checked) row.classList.add('ex-done');
  else row.classList.remove('ex-done');
  const rows = document.querySelectorAll('.ex-check-row');
  const done = Array.from(rows).filter(r=>r.classList.contains('ex-done')).length;
  const el   = document.getElementById('today-progress-txt');
  if (el) el.textContent = done + ' / ' + rows.length + ' ejercicios completados';
}

function saveWorkoutSession(planId, dayIdxStr) {
  const plan   = DB.plans().find(p => p.id === planId);
  if (!plan) return;
  const dayIdx = parseInt(dayIdxStr, 10);
  const day    = plan.days[dayIdx];
  if (!day || !day.exercises) return;

  const exercises = day.exercises.map((ex, n) => {
    const numSets = ex.sets || 1;
    const sets = Array.from({length: numSets}, (_, s) => ({
      reps:   parseInt(document.getElementById(`ex-${n}-s${s}-reps`)?.value)    || 0,
      weight: parseFloat(document.getElementById(`ex-${n}-s${s}-weight`)?.value) || 0,
      rir:    parseInt(document.getElementById(`ex-${n}-s${s}-rir`)?.value)     || 2
    }));
    return {
      name:       ex.name,
      muscle:     ex.muscle,
      targetSets: ex.sets,
      targetReps: String(ex.reps),
      sets,
      notes: (document.getElementById(`ex-${n}-notes`)?.value || '').trim()
    };
  });

  const rec = {
    id:        'wl_' + uid(),
    userId:    S.uid,
    planId:    planId,
    date:      today(),
    time:      nowTime(),
    dayName:   day.dayName,
    exercises
  };
  DB.addWlog(rec);

  const msg = document.getElementById('session-save-msg');
  if (msg) { msg.style.display='inline'; setTimeout(()=>{ msg.style.display='none'; }, 3500); }
  console.log('[GymApp] Sesión guardada:', rec.id, '| ejercicios:', exercises.length);
}

/* Food search state */
let _fsRow = null, _fsMi = null, _fsCat = 'all', _fsQuery = '';

function openFoodSearch(row, mi) {
  _fsRow = row; _fsMi = mi; _fsCat = 'all'; _fsQuery = '';
  const cats = [
    {k:'all',       lbl:'Todos'},
    {k:'proteinas', lbl:'Proteínas'},
    {k:'carbohidratos',lbl:'Carbohidratos'},
    {k:'grasas',    lbl:'Grasas'},
    {k:'frutas',    lbl:'Frutas'},
    {k:'verduras',  lbl:'Verduras'},
    {k:'lacteos',   lbl:'Lácteos'},
    {k:'legumbres', lbl:'Legumbres'},
    {k:'suplementos',lbl:'Suplementos'},
    {k:'custom',    lbl:'Mis alimentos'},
  ];
  const catBar = cats.map(c =>
    `<button class="food-cat-btn${c.k==='all'?' active':''}" onclick="setFoodCat('${c.k}',this)">${c.lbl}</button>`
  ).join('');
  const html = `
<div id="modal-food-search" class="modal-overlay" onclick="if(event.target===this)closeFoodSearch()">
  <div class="modal modal-md">
    <div class="modal-head">
      <h3 class="modal-title">Base de datos de alimentos</h3>
      <button class="modal-close" onclick="closeFoodSearch()">✕</button>
    </div>
    <div class="modal-body" style="padding-top:14px">
      <input id="fs-query" type="text" class="form-control" placeholder="🔍 Buscar alimento..." autocomplete="off"
        value="" oninput="_fsQuery=this.value;renderFoodResults()" style="margin-bottom:10px">
      <div class="food-cat-bar" id="fs-cat-bar">${catBar}</div>
      <div class="food-results" id="fs-results"></div>
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
        <button class="btn btn-sm" style="background:var(--bg-card2);border:1px solid var(--border);color:var(--green);width:100%"
          onclick="showCustomFoodForm()">+ Agregar alimento personalizado</button>
        <div class="custom-food-form" id="custom-food-form" style="margin-top:10px">
          <div class="cff-row">
            <div class="form-group"><label class="form-label">Nombre *</label>
              <input id="cff-name" class="form-control" placeholder="Ej: Arepas caseras"></div>
          </div>
          <div class="cff-row">
            <div class="form-group"><label class="form-label">Proteínas (g/100g)</label>
              <input id="cff-pro" type="number" min="0" step="0.1" class="form-control" placeholder="0" oninput="cfAutoKcal()"></div>
            <div class="form-group"><label class="form-label">Carbs (g/100g)</label>
              <input id="cff-carb" type="number" min="0" step="0.1" class="form-control" placeholder="0" oninput="cfAutoKcal()"></div>
            <div class="form-group"><label class="form-label">Grasas (g/100g)</label>
              <input id="cff-fat" type="number" min="0" step="0.1" class="form-control" placeholder="0" oninput="cfAutoKcal()"></div>
            <div class="form-group"><label class="form-label">Calorías (kcal)</label>
              <input id="cff-kcal" type="number" min="0" step="1" class="form-control" placeholder="auto"></div>
          </div>
          <button class="btn btn-primary" onclick="saveCustomFoodInSearch()">Guardar e insertar</button>
        </div>
      </div>
    </div>
  </div>
</div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  renderFoodResults();
  document.getElementById('fs-query').focus();
}

function closeFoodSearch() {
  const el = document.getElementById('modal-food-search');
  if (el) el.remove();
  _fsRow = null; _fsMi = null;
}

function setFoodCat(cat, btn) {
  _fsCat = cat;
  document.querySelectorAll('#fs-cat-bar .food-cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFoodResults();
}

function renderFoodResults() {
  const container = document.getElementById('fs-results');
  if (!container) return;
  const custom = DB.foodCustom();
  const allFoods = [...FOOD_DB, ...custom.map(f => ({...f, cat:'custom'}))];
  const q = _fsQuery.trim().toLowerCase();
  let list = allFoods.filter(f => {
    const catOk = _fsCat === 'all' || f.cat === _fsCat;
    const qOk   = !q || f.name.toLowerCase().includes(q);
    return catOk && qOk;
  });
  if (!list.length) {
    container.innerHTML = `<div class="food-no-results">No se encontraron alimentos con esos criterios.</div>`;
    return;
  }
  container.innerHTML = list.map(f => `
    <div class="food-result-item" onclick="selectFoodFromSearch(${JSON.stringify(f.name)},${f.pro},${f.carb},${f.fat},${f.cal})">
      <span class="fn">${escH(f.name)}</span>
      <span class="fm">${_catLabel(f.cat)}</span>
      <span class="fa">P:${f.pro}g C:${f.carb}g G:${f.fat}g · ${f.cal}kcal</span>
    </div>`).join('');
}

function selectFoodFromSearch(name, pro, carb, fat, cal) {
  if (!_fsRow) return;
  const foodInp = _fsRow.querySelector('.mi-food');
  const proInp  = _fsRow.querySelector('.mi-pro');
  const carbInp = _fsRow.querySelector('.mi-carb');
  const fatInp  = _fsRow.querySelector('.mi-fat');
  const kcalInp = _fsRow.querySelector('.mi-kcal');
  const qtyInp  = _fsRow.querySelector('.mi-qty');
  if (foodInp) foodInp.value = name;
  if (proInp)  proInp.value  = pro;
  if (carbInp) carbInp.value = carb;
  if (fatInp)  fatInp.value  = fat;
  if (kcalInp) kcalInp.value = cal;
  if (qtyInp && !qtyInp.value) qtyInp.value = '100g';
  if (_fsMi !== null) updateMealTotals(_fsMi);
  closeFoodSearch();
}

function showCustomFoodForm() {
  const form = document.getElementById('custom-food-form');
  if (form) form.classList.toggle('visible');
}

function cfAutoKcal() {
  const pro  = parseFloat(document.getElementById('cff-pro')?.value)  || 0;
  const carb = parseFloat(document.getElementById('cff-carb')?.value) || 0;
  const fat  = parseFloat(document.getElementById('cff-fat')?.value)  || 0;
  const el   = document.getElementById('cff-kcal');
  if (el && !el.value) el.placeholder = String(Math.round(pro*4 + carb*4 + fat*9));
}

function saveCustomFoodInSearch() {
  const name = (document.getElementById('cff-name')?.value || '').trim();
  if (!name) { alert('Ingresa el nombre del alimento.'); return; }
  const pro  = parseFloat(document.getElementById('cff-pro')?.value)  || 0;
  const carb = parseFloat(document.getElementById('cff-carb')?.value) || 0;
  const fat  = parseFloat(document.getElementById('cff-fat')?.value)  || 0;
  const calEl = document.getElementById('cff-kcal');
  const cal  = parseFloat(calEl?.value) || Math.round(pro*4 + carb*4 + fat*9);
  const custom = DB.foodCustom();
  if (custom.find(f => f.name.toLowerCase() === name.toLowerCase())) {
    alert('Ya existe un alimento personalizado con ese nombre.'); return;
  }
  custom.push({name, cat:'custom', pro, carb, fat, cal});
  DB.setFoodCustom(custom);
  selectFoodFromSearch(name, pro, carb, fat, cal);
}

function _catLabel(cat) {
  const m = {proteinas:'Proteínas',carbohidratos:'Carbos',grasas:'Grasas',
             frutas:'Frutas',verduras:'Verduras',lacteos:'Lácteos',
             legumbres:'Legumbres',suplementos:'Suplementos',custom:'Personalizado'};
  return m[cat] || cat;
}

/* ─── Grupos musculares por focus ───────────────────────────────────────── */
const AR_MUSCLE_MAP = {
  full:        ['Pecho','Espalda','Hombros','Cuádriceps','Isquiotibiales','Glúteos','Bíceps','Tríceps','Core'],
  upper:       ['Pecho','Espalda','Hombros','Bíceps','Tríceps'],
  lower:       ['Cuádriceps','Isquiotibiales','Glúteos','Core'],
  push:        ['Pecho','Hombros','Tríceps'],
  pull:        ['Espalda','Bíceps'],
  legs_glutes: ['Cuádriceps','Isquiotibiales','Glúteos'],
  core:        ['Core','Cardio']
};

/* ─── Parámetros por nivel y energía ───────────────────────────────────── */
function _arParams(level, energy, timeMins) {
  const base = {
    beginner:     {sets:3, repsLow:12, repsHigh:15, rest:90,  weightPct:.4, rir:3},
    intermediate: {sets:3, repsLow:8,  repsHigh:12, rest:60,  weightPct:.6, rir:2},
    advanced:     {sets:4, repsLow:6,  repsHigh:10, rest:45,  weightPct:.75,rir:1},
  }[level] || {sets:3,repsLow:10,repsHigh:12,rest:60,weightPct:.55,rir:2};

  const exCount = {30:4, 45:6, 60:8, 90:11}[timeMins] || 6;

  if (energy === 'low')  { base.sets = Math.max(2, base.sets - 1); base.rest += 15; }
  if (energy === 'high' && level !== 'beginner') base.sets = base.sets + 1;

  return { ...base, exCount };
}

/* ─── Generador principal ───────────────────────────────────────────────── */
function generateAutoRoutine(ans) {
  // ans: {location, time, focus, energy, level}
  const locKey  = ans.location === 'gym' ? 'gym' : 'home';
  const muscles = AR_MUSCLE_MAP[ans.focus] || AR_MUSCLE_MAP.full;
  const params  = _arParams(ans.level, ans.energy, parseInt(ans.time));
  const adv     = ans.level === 'advanced' && ans.energy === 'high';

  // Filtrar ejercicios por ubicación y músculos objetivo
  const pool = AR_EXERCISES.filter(e =>
    e.loc.includes(locKey) && muscles.includes(e.muscle)
  );

  // Distribuir equilibradamente por grupo muscular
  const chosen = [];
  const usedMuscles = {};
  const shuffled = [...pool].sort(() => Math.random() - .5);

  // Primera pasada: 1 ejercicio por músculo
  for (const m of muscles) {
    if (chosen.length >= params.exCount) break;
    const ex = shuffled.find(e => e.muscle === m && !chosen.includes(e));
    if (ex) { chosen.push(ex); usedMuscles[m] = 1; }
  }
  // Segunda pasada: rellenar si faltan
  for (const ex of shuffled) {
    if (chosen.length >= params.exCount) break;
    if (!chosen.includes(ex)) chosen.push(ex);
  }

  // Priorizar: poner Core/Cardio al final
  chosen.sort((a,b) => {
    const order = m => (m==='Core'||m==='Cardio') ? 1 : 0;
    return order(a.muscle) - order(b.muscle);
  });

  // Construir ejercicios con parámetros
  const exercises = chosen.map((e, i) => {
    const isLast  = i === chosen.length - 1;
    const isCore  = e.muscle === 'Core' || e.muscle === 'Cardio';
    const sets    = isCore ? Math.min(params.sets, 3) : params.sets;
    const reps    = isCore ? (e.muscle==='Cardio' ? '30 seg' : `${params.repsLow}-${params.repsHigh}`)
                           : `${params.repsLow}-${params.repsHigh}`;
    const weight  = (e.eq === 'bodyweight' || e.eq === 'household') ? 0
                  : Math.round(params.weightPct * (e.muscle.includes('Bíceps')||e.muscle.includes('Tríceps') ? 30 :
                      e.muscle==='Hombros' ? 50 :
                      e.muscle==='Pecho' ? 80 :
                      e.muscle==='Espalda' ? 70 :
                      e.muscle==='Cuádriceps'&&e.eq==='machine' ? 80 :
                      e.muscle==='Isquiotibiales'&&e.eq==='machine' ? 50 :
                      e.muscle==='Glúteos' ? 60 : 60) / 2.5) * 2.5; // round to 2.5kg

    const dropSet = adv && !isCore && isLast;
    const rir     = adv ? (isLast ? 0 : params.rir) : params.rir;
    const tip     = e.eq==='bodyweight' ? 'Peso corporal — enfocate en la técnica'
                  : e.eq==='household'  ? 'Usa lo que tengas en casa'
                  : weight > 0          ? `Peso sugerido: ~${weight}kg`
                  : '';

    return { name:e.name, muscle:e.muscle, sets, reps, weight, rest:params.rest, rir, dropSet, tip,
             eq:e.eq };
  });

  const focusLabels = {
    full:'Cuerpo completo', upper:'Tren superior', lower:'Tren inferior',
    push:'Empuje', pull:'Jalón', legs_glutes:'Pierna y glúteo', core:'Core y abdomen'
  };
  const locLabels = {gym:'Gimnasio', home:'Casa', none:'Sin equipamiento'};

  return {
    id:       'auto_' + Date.now(),
    date:     today(),
    time:     nowTime(),
    location: locLabels[ans.location] || ans.location,
    focus:    focusLabels[ans.focus]  || ans.focus,
    level:    ans.level,
    energy:   ans.energy,
    duration: ans.time + ' min',
    advanced: adv,
    exercises
  };
}

<div class="survey-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <strong style="font-size:.9rem">🤖 Generador de rutina automática</strong>
    <button class="btn btn-sm" style="padding:3px 10px;font-size:.78rem" onclick="document.getElementById('ar-survey-wrap').style.display='none'">✕ Cerrar</button>
  </div>
  <div class="survey-progress-bar"><div class="survey-progress-fill" style="width:${pct}%"></div></div>
  <div class="survey-q">${q.label}<small>${q.hint}</small></div>
  <div class="survey-opts" id="ar-opts">
    ${q.opts.map(o=>`
    <label class="survey-opt${_arAnswers[q.key]===o.val?' ar-sel':''}">
      <input type="radio" name="ar-q" value="${o.val}" ${_arAnswers[q.key]===o.val?'checked':''}
        onchange="_arSelect('${q.key}','${o.val}',this.closest('.survey-opt'))">
      <span>${o.txt}</span>
    </label>`).join('')}
  </div>
  <div class="survey-nav">
    ${_arStep > 0 ? `<button class="btn btn-sm" onclick="_arBack()">← Anterior</button>` : ''}
    <button class="btn btn-primary btn-sm" onclick="_arNext()" ${_arAnswers[q.key]?'':'disabled'} id="ar-btn-next">
      ${_arStep < total-1 ? 'Siguiente →' : '🚀 Generar rutina'}
    </button>
    <span class="survey-progress">Pregunta ${_arStep+1} de ${total}</span>
  </div>
</div>`;
}

function _arSelect(key, val, el) {
  _arAnswers[key] = val;
  el.closest('.survey-opts').querySelectorAll('.survey-opt').forEach(o => o.classList.remove('ar-sel'));
  el.classList.add('ar-sel');
  const btn = document.getElementById('ar-btn-next');
  if (btn) btn.disabled = false;
}

function _arBack() {
  if (_arStep > 0) { _arStep--; _arRenderStep(); }
}

function _arNext() {
  const q = AR_QUESTIONS[_arStep];
  if (!_arAnswers[q.key]) return;
  if (_arStep < AR_QUESTIONS.length - 1) {
    _arStep++;
    _arRenderStep();
  } else {
    _arGenerate();
  }
}

/* ─── Genera y muestra la rutina ────────────────────────────────────────── */
function _arGenerate() {
  _arRoutine = generateAutoRoutine(_arAnswers);
  const wrap = document.getElementById('ar-survey-wrap');
  if (!wrap) return;

  const levelLabel = {beginner:'Principiante', intermediate:'Intermedio', advanced:'Avanzado'};
  const energyLabel = {high:'Alta energía', normal:'Normal', low:'Baja energía'};

  wrap.innerHTML = `
<div class="session-logger" id="ar-session-logger">
  <div class="ar-routine-header">
    <div>
      <strong style="font-size:.95rem">🤖 Rutina generada automáticamente</strong><br>
      <span style="font-size:.78rem;color:var(--text-dim)">${_arRoutine.focus} · ${_arRoutine.location} · ${_arRoutine.duration}</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="ar-badge">${levelLabel[_arRoutine.level]||_arRoutine.level}</span>
      <span class="ar-badge">${energyLabel[_arRoutine.energy]||_arRoutine.energy}</span>
      ${_arRoutine.advanced ? '<span class="ar-technique-tag">Técnicas avanzadas</span>' : ''}
    </div>
  </div>

  ${_arRoutine.exercises.map((ex,n)=>`
  <div class="session-ex-block">
    <div class="session-ex-name">${n+1}. ${escH(ex.name)}
      ${ex.dropSet ? '<span class="ar-technique-tag">Drop-set</span>' : ''}
    </div>
    <div class="session-ex-target">${escH(ex.muscle)} · ${ex.sets} series × ${escH(String(ex.reps))} reps · Descanso: ${ex.rest}s · RIR meta: ${ex.rir}</div>
    ${ex.tip ? `<div class="ar-ex-tip">💡 ${escH(ex.tip)}</div>` : ''}
    <table class="session-set-table" style="margin-top:8px">
      <thead><tr><th>Serie</th><th>Reps</th><th>Peso (kg)</th><th>RIR</th></tr></thead>
      <tbody>
        ${Array.from({length:ex.sets},(_,s)=>`<tr>
          <td>Serie ${s+1}${ex.dropSet&&s===ex.sets-1?' <span style="font-size:.65rem;color:#ff8800">(drop)</span>':''}</td>
          <td><input id="ar-${n}-s${s}-reps" type="number" min="0" max="100" class="form-control"
              placeholder="${String(ex.reps).split('-')[0]||10}"></td>
          <td><input id="ar-${n}-s${s}-weight" type="number" min="0" step="0.5" class="form-control"
              placeholder="${ex.weight||0}" value="${ex.eq==='bodyweight'||ex.eq==='household'?'':ex.weight||''}"></td>
          <td><input id="ar-${n}-s${s}-rir" type="number" min="0" max="5" class="form-control"
              placeholder="${ex.rir}" value="${ex.rir}"></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <input id="ar-${n}-notes" type="text" class="form-control session-set-notes" placeholder="Notas (opcional)">
  </div>`).join('')}

  <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="saveAutoRoutineSession()">💾 Guardar sesión</button>
    <button class="btn btn-sm" onclick="openAutoRoutineSurvey()">🔄 Generar otra</button>
    <span id="ar-save-msg" style="font-size:.85rem;color:var(--green);display:none">✅ Sesión guardada</span>
  </div>
</div>`;
}

/* ─── Guarda la sesión de rutina automática ─────────────────────────────── */
function saveAutoRoutineSession() {
  if (!_arRoutine) return;
  const exercises = _arRoutine.exercises.map((ex, n) => {
    const numSets = ex.sets || 1;
    const sets = Array.from({length: numSets}, (_, s) => ({
      reps:   parseInt(document.getElementById(`ar-${n}-s${s}-reps`)?.value)    || 0,
      weight: parseFloat(document.getElementById(`ar-${n}-s${s}-weight`)?.value) || 0,
      rir:    parseInt(document.getElementById(`ar-${n}-s${s}-rir`)?.value)     || ex.rir
    }));
    return {
      name:       ex.name,
      muscle:     ex.muscle,
      targetSets: ex.sets,
      targetReps: String(ex.reps),
      sets,
      notes: (document.getElementById(`ar-${n}-notes`)?.value || '').trim()
    };
  });

  const rec = {
    id:       'wl_' + uid(),
    userId:   S.uid,
    planId:   _arRoutine.id,
    date:     today(),
    time:     nowTime(),
    dayName:  _arRoutine.focus,
    isAuto:   true,
    autoMeta: { location:_arRoutine.location, level:_arRoutine.level,
                energy:_arRoutine.energy, duration:_arRoutine.duration },
    exercises
  };
  DB.addWlog(rec);

  const msg = document.getElementById('ar-save-msg');
  if (msg) { msg.style.display='inline'; setTimeout(()=>{ msg.style.display='none'; }, 3500); }
  console.log('[GymApp] Auto-sesión guardada:', rec.id);
}

// Asistencias demo (últimas semanas)
const DEMO_ATT = (() => {
  const recs = [];
  const users = [
    { id:'u01', freq:4, start:'2025-01-01' },
    { id:'u02', freq:3, start:'2023-07-01' },
    { id:'u03', freq:2, start:'2023-01-15' }
  ];
  users.forEach(({ id, freq, start }) => {
    const d = new Date(start + 'T12:00:00');
    const end = new Date();
    while (d <= end) {
      const dow = d.getDay(); // 0=dom,6=sab
      if (dow >= 1 && dow <= 5) { // L-V
        // probabilidad según freq
        const prob = freq / 5;
        if (Math.random() < prob) {
          const h = 6 + Math.floor(Math.random() * 14);
          const m = Math.floor(Math.random() * 60);
          recs.push({
            id: `att_${id}_${d.toISOString().slice(0,10)}`,
            userId: id,
            date: d.toISOString().slice(0,10),
            time: `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`
          });
        }
      }
      d.setDate(d.getDate() + 1);
    }
  });
  return recs;
})();

       measures:{chest:88,waist:68,hip:95,rArm:28,lArm:28,rThigh:51,lThigh:50},restHR:71}
    ],
    u03: [
      {date:'2023-01-05',weight:95,height:175,bodyFat:30,muscleMass:36,
       measures:{chest:108,waist:100,hip:108,rArm:36,lArm:36,rThigh:62,lThigh:62},restHR:85},
      {date:'2023-07-05',weight:91,height:175,bodyFat:27,muscleMass:37,
       measures:{chest:106,waist:96,hip:105,rArm:35,lArm:35,rThigh:60,lThigh:60},restHR:82},
      {date:'2024-03-10',weight:88,height:175,bodyFat:25,muscleMass:38,

       measures:{chest:103,waist:89,hip:100,rArm:36,lArm:35,rThigh:58,lThigh:58},restHR:76}
    ]
  };

  try {
    /* ── PASO 1: Carga de datos demo ──────────────────────────────────────────
       Condición doble: !isInit() O lista de usuarios vacía.
       Esto cubre el caso en que gp_init está seteado pero gp_users fue
       borrado independientemente (p.ej. localStorage.clear() con gp_init residual). */
    const needsLoad = !DB.isInit() || DB.users().length === 0;
    if (needsLoad) {
      /* Asegura physicalHistory en DEMO_USERS antes de guardar */
      const demoWithHist = DEMO_USERS.map(u => {
        if (PHIST_DEMO[u.id] && (!u.physicalHistory || u.physicalHistory.length < PHIST_DEMO[u.id].length)) {
          return Object.assign({}, u, { physicalHistory: PHIST_DEMO[u.id] });
        }
        return u;
      });
      DB.setUsers(demoWithHist);
      DB.setPlans(DEMO_PLANS);
      DB.setNutris(DEMO_NUTRI);
      try { DB.setAtt(DEMO_ATT); } catch(e) { DB.setAtt([]); }
      if (DB.wlogs().length === 0) DB.setWlogs(DEMO_WORKOUT_LOGS);
      DB.setInit();
    }

    /* ── Migración: reemplaza logs en formato antiguo (sin sets[]) ─────────── */
    const _wlCheck = DB.wlogs();
    if (_wlCheck.length > 0 && _wlCheck[0]?.exercises?.[0] && !_wlCheck[0].exercises[0].sets) {
      DB.setWlogs(DEMO_WORKOUT_LOGS);
    }

    /* ── PASO 2: Credenciales admin ───────────────────────────────────────────
       Escribe explícitamente en localStorage para no depender del fallback JS. */
    if (!localStorage.getItem('gp_apass')) {
      DB.setAdminPass('GymPro2024');
    }

    /* ── PASO 3: Garantía physicalHistory (idempotente) ───────────────────── */
    const users = DB.users();
    let dirty = false;
    Object.keys(PHIST_DEMO).forEach(id => {
      const idx = users.findIndex(u => u.id === id);
      if (idx >= 0) {
        const stored = users[idx].physicalHistory;
        if (!stored || stored.length < PHIST_DEMO[id].length) {
          users[idx].physicalHistory = PHIST_DEMO[id];
          dirty = true;
        }
      }
    });
    if (dirty) DB.setUsers(users);

  } catch (err) {
    /* ── FALLBACK DE EMERGENCIA ───────────────────────────────────────────────
       Si algo falló durante la init, resetea todo desde cero para garantizar
       que siempre haya credenciales válidas. */
    console.error('[GymApp] Error en initApp, reseteo de emergencia:', err);
    try {
      localStorage.clear();
      const demoSafe = DEMO_USERS.map(u =>
        Object.assign({}, u, { physicalHistory: PHIST_DEMO[u.id] || [] })
      );
      DB.setUsers(demoSafe);
      DB.setPlans(DEMO_PLANS);
      DB.setNutris(DEMO_NUTRI);
      DB.setAtt([]);
      DB.setWlogs(DEMO_WORKOUT_LOGS);
      DB.setInit();
      DB.setAdminPass('GymPro2024');
    } catch(e2) {
      console.error('[GymApp] Fallback también falló:', e2);
    }
  }

  setRole('admin');
}

// Arrancar al cargar
document.addEventListener('DOMContentLoaded', initApp);
